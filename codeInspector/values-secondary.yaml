################################################################
# Secondary Hub (Warm Standby) Values Profile
################################################################

global:
  ocm:
    enabled: true
    role: "hub"
    clusterSet: "sandbox-spokes"
    placementName: "sandbox-spoke-placement"

agentgateway:
  enabled: true
  httproute:
    hostnames:
      - api-sandbox.01security.com
      - 10.0.10.9
      - 10.99.0.100
      - 10.99.0.1
      - 10.99.0.2
      - 192.168.100.10
      - 192.168.100.20
      - 192.168.101.20
  gateway:
    addresses:
      - value: 172.18.255.200

apiServer:
  enabled: true
  configMap:
    APP_ENV: "production"
    WORKLOAD_PROVIDER: "ocm"
    PLACEMENT_NAME: "sandbox-spoke-placement"
  deployment:
    replicaCount: 1 # Warm Standby
    image:
      repository: 01community/01sandbox-api
      tag: "v0.7.9"
      pullPolicy: IfNotPresent
  sealedSecrets:
    enabled: false
  postgresql:
    enabled: false
  cnpg:
    enabled: true
    instances: 1
    storage: "5Gi"
    storageClassName: "standard"
    database: "apikeys"
    user: "postgres"
    password: "password123"
    replication:
      enabled: true
      role: "standby"
      primaryHost: "10.99.0.1"
      primaryPort: 5432
  redis:
    enabled: false
  valkey:
    enabled: true
    host: "redis-service"
    port: 6379
    password: ""
    image:
      repository: valkey/valkey
      tag: "7.2-alpine"
      pullPolicy: IfNotPresent
    replication:
      enabled: true
      role: "standby"
      primaryHost: "10.99.0.1"
      primaryPort: 6379


opensandbox:
  enabled: true
  multiCluster:
    enabled: true
    clusterSet: "sandbox-spokes"
    placementName: "sandbox-spoke-placement"
  server:
    replicaCount: 1 # Warm Standby
    workloadProvider: "ocm"
    placementName: "sandbox-spoke-placement"
    image:
      repository: 01community/01sandbox-opensandbox-server
      tag: "v0.7.10-ocm"
      pullPolicy: IfNotPresent
    storage:
      storageClassName: "standard"
  controller:
    replicaCount: 1
    image:
      repository: 01community/01sandbox-opensandbox-controller
      tag: "v0.7.3"
      pullPolicy: IfNotPresent

cloudnative-pg:
  enabled: true
  crds:
    create: false
