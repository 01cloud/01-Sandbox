##################################################################################################

################################################################
# This chart aggregates values from all sub-chart
################################################################

global:
  apiRoutePrefix: "/api/v1/01sbx"
  JWT_PUBLIC_JWKS: ""
  allowedIps:
    - "110.44.123.206"
    - "10."
    - "127.0.0.1"
    - "::1"
  ocm:
    enabled: true
    role: "hub" # "hub" or "spoke"
    primaryHub: "primaryhub"
    primaryHubIp: "10.9.9.10"
    secondaryHub: "secondaryhub"
    secondaryHubIp: "10.9.9.20"
    clusterSet: "sandbox-spokes"
    placementName: "sandbox-spoke-placement"
    spokes:
      - name: "spoke-us-east-1"
        region: "us-east-1"
        wireguardIp: "10.9.9.30"
      - name: "spoke-eu-central-1"
        region: "eu-central-1"
        wireguardIp: "10.9.9.40"
      - name: "spoke-us-west-1"
        region: "us-west-1"
        wireguardIp: "10.9.9.50"
################################################################
# Agent Gateway  values
################################################################
agentgateway:
  enabled: true
  namespace: agentgateway-system
  httproute:
    hostnames:
      # - api-sandbox.01security.com
      - 10.0.8.9
    backendService:
      name: sandbox-api-service
      port: 80
  gateway:
    gatewayClassName: agentgateway
    addresses:
      - value: 10.0.8.9
    listeners:
      - protocol: HTTP
        port: 80
        name: http
      # - protocol: HTTPS
      #   port: 443
      #   name: https
      #   tls:
      #     certificateRefs:
      #       - name: agentgateway-tls
      - protocol: TCP
        port: 5432
        name: postgresql
      - protocol: TCP
        port: 6379
        name: redis
      - protocol: TCP
        port: 5672
        name: rabbitmq-amqp
  policy:
    authenticationType: "jwt"
    jwtMode: "Strict"
    rateLimit:
      enabled: false
      requests: 500
      unit: "Minutes"
################################################################
# Agent Gateway Controller values
################################################################
agentgateway-controller:
  enabled: true
  controller:
    extraEnv:
      KGW_ENABLE_GATEWAY_API_EXPERIMENTAL_FEATURES: "true"
    image:
      pullPolicy: IfNotPresent
################################################################
# API Server component values
################################################################
apiServer:
  enabled: true
  namespace: opensandbox-system
  configMap:
    PYTHONUNBUFFERED: "1"
    APP_ENV: "production"
    SCANNER_IMAGE_PYTHON: "199012118961/01sandbox-scanner-python:dev"
    SCANNER_IMAGE_GO: "199012118961/01sandbox-scanner-go:dev"
    SCANNER_IMAGE_JAVA: "199012118961/01sandbox-scanner-java:dev"
    SCANNER_IMAGE_NODE: "199012118961/01sandbox-scanner-node:dev"
    SCANNER_IMAGE_K8S: "199012118961/01sandbox-scanner-k8s:dev"
    SCANNER_IMAGE_RUST: "199012118961/01sandbox-scanner-rust:dev"
    SCANNER_IMAGE_SHELL: "199012118961/01sandbox-scanner-shell:dev"
    SCANNER_IMAGE_CPP: "199012118961/01sandbox-scanner-cpp:dev"
    SCANNER_IMAGE_RUBY: "199012118961/01sandbox-scanner-ruby:dev"
    SCANNER_IMAGE_TERRAFORM: "199012118961/01sandbox-scanner-terraform:dev"
    SCANNER_IMAGE_DEFAULT: "199012118961/01sandbox-scanner-python:dev"
    PORT: "8000"
    BACKEND_URL_OPENSANDBOX: "http://opensandbox-server.opensandbox-system.svc.cluster.local"
    RATE_LIMIT_REQUESTS: "20"
    RATE_LIMIT_WINDOW_SECS: "60"
    GATEWAY_SECRET_NAME: "apikey"
