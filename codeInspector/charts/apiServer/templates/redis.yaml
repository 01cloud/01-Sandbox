{{- if and .Values.redis.enabled (not (and .Values.valkey .Values.valkey.enabled)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sandbox-api-secret
              key: REDIS_PASSWORD
              optional: true
        command:
        - sh
        - -c
        - |
          EXTRA_ARGS=""
          {{- if and .Values.redis.replication .Values.redis.replication.enabled (eq .Values.redis.replication.role "standby") }}
          EXTRA_ARGS="--replicaof {{ .Values.redis.replication.primaryHost }} {{ .Values.redis.replication.primaryPort }}"
          {{- end }}
          if [ -n "$REDIS_PASSWORD" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --requirepass $REDIS_PASSWORD --masterauth $REDIS_PASSWORD"
          fi
          exec redis-server $EXTRA_ARGS
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.host }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: redis
  ports:
  - port: {{ .Values.redis.port }}
    targetPort: 6379
{{- end }}
