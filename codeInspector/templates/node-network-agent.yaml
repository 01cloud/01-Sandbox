{{- if and .Values.nodeNetworkAgent (default false .Values.nodeNetworkAgent.enabled) }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-network-agent
  namespace: {{ default "kube-system" .Values.nodeNetworkAgent.namespace }}
  labels:
    app.kubernetes.io/name: node-network-agent
    app.kubernetes.io/component: node-network-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-network-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-network-agent
        app.kubernetes.io/component: node-network-agent
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: network-agent
          image: {{ .Values.nodeNetworkAgent.image | default "alpine:3.19" }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "=== Starting Kubernetes-Native Node Network Agent ==="
              # Ensure kernel IP forwarding on host network
              sysctl -w net.ipv4.ip_forward=1 2>/dev/null || true
              sysctl -w net.ipv4.conf.all.forwarding=1 2>/dev/null || true

              echo "Node Network Agent active. Monitoring routing state..."
              while true; do
                sleep 3600
              done
          securityContext:
            privileged: true
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi
{{- end }}
