name: Automated GitHub Release

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_override:
        description: "Tag to release (e.g. v1.4.2). Leave blank to use the latest tag."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Resolve the tag pushed by cicd.yml ──────────────────────
      - name: Resolve release tag
        id: get_tag
        run: |
          set -euo pipefail
          git fetch --tags --force

          OVERRIDE="${{ github.event.inputs.tag_override }}"
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"

          if [ -n "$OVERRIDE" ]; then
            # Manual run with explicit tag
            TAG="$OVERRIDE"
            echo "Using manually specified tag: $TAG"
          elif [ -n "$COMMIT_SHA" ]; then
            # Automated workflow_run — find tag on the triggering commit
            TAG=$(git tag --points-at "$COMMIT_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ -z "$TAG" ]; then
              echo "No tag on triggering commit ($COMMIT_SHA), falling back to latest semver tag..."
              TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            fi
          else
            # Manual dispatch with no override — use latest semver tag
            echo "Manual dispatch without override — resolving latest semver tag..."
            TAG=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi

          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve a semver tag — aborting release."
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved tag: $TAG"

      # ── Guard: skip if a release for this tag already exists ────
      - name: Check for duplicate release
        id: check_existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.get_tag.outputs.tag }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # ── Build structured release notes ──────────────────────────
      - name: Build release notes
        id: changelog
        if: steps.check_existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.get_tag.outputs.tag }}"
          REPO="${{ github.repository }}"
          RELEASE_DATE=$(date -u +"%B %d, %Y")

          # Find previous tag using awk (safe — never exits 1 unlike grep -B1)
          PREV_TAG=$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | awk -v tag="$TAG" 'prev && $0==tag{print prev} {prev=$0}')

          if [ -z "$PREV_TAG" ]; then
            RANGE="$TAG"
          else
            RANGE="${PREV_TAG}..${TAG}"
          fi
          echo "Diffing range: $RANGE"

          # Pull merged PRs in range via GitHub CLI and categorise by label
          NEW_FEATURES=""
          BUG_FIXES=""
          DOC_UPDATES=""

          while IFS= read -r line; do
            PR_NUM=$(echo "$line" | awk '{print $1}')
            PR_TITLE=$(echo "$line" | cut -d' ' -f2-)
            LABELS=$(gh pr view "$PR_NUM" --repo "$REPO" --json labels --jq '.labels[].name' 2>/dev/null || true)

            ENTRY="* ${PR_TITLE} ([#${PR_NUM}](https://github.com/${REPO}/pull/${PR_NUM}))"

            if echo "$LABELS" | grep -qi "bug\|fix"; then
              BUG_FIXES="${BUG_FIXES}\n${ENTRY}"
            elif echo "$LABELS" | grep -qi "doc\|documentation"; then
              DOC_UPDATES="${DOC_UPDATES}\n${ENTRY}"
            else
              NEW_FEATURES="${NEW_FEATURES}\n${ENTRY}"
            fi
          done < <(git log "$RANGE" --merges --pretty=format:"%s" \
            | grep -oP '(?<=Merge pull request #)\d+ .+' \
            | sed 's/^/PR /' || true)

          # Fallback text when a section is empty
          [ -z "$NEW_FEATURES" ] && NEW_FEATURES="* No new features in this release"
          [ -z "$BUG_FIXES"    ] && BUG_FIXES="* No bug fixes in this release"
          [ -z "$DOC_UPDATES"  ] && DOC_UPDATES="* No documentation updates in this release"

          # Render template
          BODY=$(cat .github/release-template.md)
          BODY="${BODY//\$TAG/$TAG}"
          BODY="${BODY//\$RELEASE_DATE/$RELEASE_DATE}"
          BODY="${BODY//\$NEW_FEATURES/$(printf '%b' "$NEW_FEATURES")}"
          BODY="${BODY//\$BUG_FIXES/$(printf '%b' "$BUG_FIXES")}"
          BODY="${BODY//\$DOC_UPDATES/$(printf '%b' "$DOC_UPDATES")}"

          {
            echo "body<<EOF"
            printf '%s' "$BODY"
            echo ""
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # ── Create the GitHub Release ────────────────────────────────
      - name: Create GitHub Release
        if: steps.check_existing.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.get_tag.outputs.tag }}
          name:       01Sandbox ${{ steps.get_tag.outputs.tag }} Release Notes
          body:       ${{ steps.changelog.outputs.body }}
          draft:      false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Summary ──────────────────────────────────────────────────
      - name: Job summary
        if: always()
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          SKIP="${{ steps.check_existing.outputs.skip }}"
          if [ "$SKIP" == "true" ]; then
            echo "### ⏭️ Release skipped — \`$TAG\` already exists" >> $GITHUB_STEP_SUMMARY
          else
            echo "### 🚀 Released \`$TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "https://github.com/${{ github.repository }}/releases/tag/$TAG" >> $GITHUB_STEP_SUMMARY
          fi