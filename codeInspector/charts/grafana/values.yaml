# Default values for grafana
namespace: opensandbox-system

prometheusNamespace: opensandbox-system
prometheusServiceName: prometheus-service
prometheusPort: 9090
prometheusAuth:
  enabled: true
  username: "prometheus-rw"
  password: "PrometheusRemoteWriteSecure2026!"

# Multi-Cluster remote Prometheus endpoints (via WireGuard overlay 10.99.0.0/24)
remoteClusters:
  secondaryhub:
    prometheusUrl: "http://10.99.0.2:30900"
  spoke1:
    prometheusUrl: "http://10.99.0.3:30900"
  spoke2:
    prometheusUrl: "http://10.99.0.4:30900"
  spoke3:
    prometheusUrl: "http://10.99.0.5:30900"

replicaCount: 1

ingressRoute:
  enabled: true
ingressHost: "api-sandbox.01security.com"
ingressHostnames:
  - api-sandbox.01security.com
  - 10.0.10.9
ingressPath: "/grafana"


image:
  repository: grafana/grafana
  tag: "11.1.0"
  pullPolicy: IfNotPresent

persistence:
  enabled: false
  pvcName: "grafana-pvc"



service:
  type: NodePort
  port: 3000
  nodePort: 32000

adminPassword: "admin"

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"
