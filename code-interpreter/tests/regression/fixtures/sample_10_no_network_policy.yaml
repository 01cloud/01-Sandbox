apiVersion: v1
kind: Namespace
metadata:
  name: sample-10-no-network-policy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isolated-workload
  namespace: sample-10-no-network-policy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: app
          image: nginx:latest
# VULN: Namespace is created, deployment is created, but no NetworkPolicy exists.
# By default in K8s, if no network policy is declared, all ingress/egress
# network traffic is allowed to and from all pods in the namespace.
