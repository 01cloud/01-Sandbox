apiVersion: v1
kind: Namespace
metadata:
  name: open-cluster-management-auto-acceptor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ocm-auto-acceptor-sa
  namespace: open-cluster-management-auto-acceptor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ocm-auto-acceptor-role
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests", "certificatesigningrequests/approval"]
  verbs: ["get", "list", "watch", "update", "patch", "create", "delete"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["signers"]
  resourceNames: ["kubernetes.io/kube-apiserver-client"]
  verbs: ["approve"]
- apiGroups: ["cluster.open-cluster-management.io"]
  resources: ["managedclusters", "managedclusters/status", "managedclusters/accept"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ocm-auto-acceptor-binding
subjects:
- kind: ServiceAccount
  name: ocm-auto-acceptor-sa
  namespace: open-cluster-management-auto-acceptor
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocm-auto-acceptor-script
  namespace: open-cluster-management-auto-acceptor
data:
  auto-acceptor.sh: |
    #!/bin/sh
    echo "[$(date -Iseconds)] Starting OCM Priority Auto-Acceptor Loop in Kubernetes..."
    PRIMARY_HUB="10.99.0.1"

    while true; do
      # Determine if running on Secondary Hub by checking node name or env var
      NODE_NAME=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
      if echo "$NODE_NAME" | grep -q "secondaryhub"; then
        IS_SECONDARY=true
      elif [ "$HUB_ROLE" = "secondary" ]; then
        IS_SECONDARY=true
      else
        IS_SECONDARY=false
      fi

      # Check if Primary Hub (10.99.0.1) is UP and reachable
      if curl -k -m 2 -s https://${PRIMARY_HUB}:6443/livez >/dev/null 2>&1; then
        PRIMARY_ALIVE=true
      else
        PRIMARY_ALIVE=false
      fi

      if [ "$IS_SECONDARY" = "true" ] && [ "$PRIMARY_ALIVE" = "true" ]; then
        # Primary Hub is UP -> Secondary Hub MUST YIELD & CANCEL SPOKE ACCEPTANCE IMMEDIATELY
        TARGET_SPOKES=$(kubectl get managedcluster -o json 2>/dev/null | jq -r '.items[]? | select(.spec.hubAcceptsClient == true or (.status.conditions[]? | select(.type=="ManagedClusterConditionAvailable" and .status!="False"))) | .metadata.name')
        for spoke in $TARGET_SPOKES; do
          if [ -n "$spoke" ]; then
            echo "[$(date -Iseconds)] Primary Hub is UP. Yielding standby: setting hubAcceptsClient=false & AVAILABLE=False for $spoke"
            kubectl patch managedcluster "$spoke" --type merge -p '{"spec":{"hubAcceptsClient":false}}' 2>/dev/null || true
            kubectl patch managedcluster "$spoke" --subresource=status --type merge -p "{\"status\":{\"conditions\":[{\"type\":\"ManagedClusterConditionAvailable\",\"status\":\"False\",\"reason\":\"PrimaryHubActive\",\"message\":\"Primary hub active; secondary hub yielding standby\",\"lastTransitionTime\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}]}}" 2>/dev/null || true
            kubectl delete lease managed-cluster-lease -n "$spoke" 2>/dev/null || true
          fi
        done
      else
        # Either we are Primary Hub OR Primary Hub is DOWN -> Accept spokes
        PENDING_CSRS=$(kubectl get csr -o json 2>/dev/null | jq -r '.items[]? | select(.status.conditions == null and (.spec.signerName == "kubernetes.io/kube-apiserver-client" or .spec.signerName == "open-cluster-management.io/sub-k8s-signer")) | .metadata.name')
        for csr in $PENDING_CSRS; do
          if [ -n "$csr" ]; then
            echo "[$(date -Iseconds)] Auto-approving pending CSR: $csr"
            kubectl certificate approve "$csr" 2>/dev/null || true
          fi
        done

        UNACCEPTED=$(kubectl get managedcluster -o json 2>/dev/null | jq -r '.items[]? | select(.spec.hubAcceptsClient == false) | .metadata.name')
        for spoke in $UNACCEPTED; do
          if [ -n "$spoke" ]; then
            echo "[$(date -Iseconds)] Auto-accepting managedcluster: $spoke"
            kubectl patch managedcluster "$spoke" --type merge -p '{"spec":{"hubAcceptsClient":true}}' 2>/dev/null || true
          fi
        done
      fi

      # Auto-prune old approved CSRs to prevent hitting OCM 10-CSR limit
      APPROVED_CSRS=$(kubectl get csr -o json 2>/dev/null | jq -r '.items[]? | select(.status.conditions[]?.type == "Approved") | .metadata.name')
      CSR_COUNT=$(echo "$APPROVED_CSRS" | wc -w)
      if [ "$CSR_COUNT" -gt 3 ]; then
        for csr in $APPROVED_CSRS; do
          kubectl delete csr "$csr" 2>/dev/null || true
        done
      fi

      sleep 2
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocm-auto-acceptor
  namespace: open-cluster-management-auto-acceptor
  labels:
    app: ocm-auto-acceptor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocm-auto-acceptor
  template:
    metadata:
      labels:
        app: ocm-auto-acceptor
    spec:
      serviceAccountName: ocm-auto-acceptor-sa
      containers:
      - name: auto-acceptor
        image: bitnami/kubectl:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "/scripts/auto-acceptor.sh"]
        volumeMounts:
        - name: script-vol
          mountPath: /scripts
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: script-vol
        configMap:
          name: ocm-auto-acceptor-script
          defaultMode: 0755
