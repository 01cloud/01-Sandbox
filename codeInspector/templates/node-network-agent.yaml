{{- if and .Values.nodeNetworkAgent (default false .Values.nodeNetworkAgent.enabled) }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-network-agent
  namespace: {{ default "kube-system" .Values.nodeNetworkAgent.namespace }}
  labels:
    app.kubernetes.io/name: node-network-agent
    app.kubernetes.io/component: node-network-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-network-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-network-agent
        app.kubernetes.io/component: node-network-agent
    spec:
      serviceAccountName: node-network-agent
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: network-agent
          image: {{ .Values.nodeNetworkAgent.image | default "alpine:3.19" }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Installing required network & AWS CLI utilities..."
              apk add --no-cache bash curl jq wireguard-tools iptables aws-cli >/dev/null 2>&1 || true
              exec /bin/bash /opt/scripts/sync-wireguard.sh
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AWS_REGION
              value: {{ .Values.nodeNetworkAgent.awsRegion | default "us-east-1" | quote }}
            - name: SYNC_INTERVAL
              value: {{ .Values.nodeNetworkAgent.syncInterval | default 60 | quote }}
            - name: AUTO_DISABLE_HOST_CRON
              value: {{ .Values.nodeNetworkAgent.autoDisableHostCron | default true | quote }}
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - SYS_ADMIN
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - name: scripts
              mountPath: /opt/scripts
            - name: host-wireguard
              mountPath: /host/etc/wireguard
            - name: host-cron
              mountPath: /host/etc/cron.d
      volumes:
        - name: scripts
          configMap:
            name: node-network-agent-scripts
            defaultMode: 0755
        - name: host-wireguard
          hostPath:
            path: /etc/wireguard
            type: DirectoryOrCreate
        - name: host-cron
          hostPath:
            path: /etc/cron.d
            type: DirectoryOrCreate
{{- end }}
