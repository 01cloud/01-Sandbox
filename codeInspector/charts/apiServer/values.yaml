# Default values for apiServer
namespace: sandbox

configMap:
  PYTHONUNBUFFERED: "1"
  APP_ENV: "production"
  PORT: "8000"
  BACKEND_URL_OPENSANDBOX: "http://opensandbox-server.opensandbox-system.svc.cluster.local"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW_SECS: "60"
  GATEWAY_SECRET_NAME: "apikey"
  GATEWAY_SECRET_NAMESPACE: "agentgateway-system"
  GATEWAY_SECRET_KEY: "api-key"
  JWT_ALGORITHM: "RS256"
  JWT_EXPIRATION_MINUTES: "60"
  JWT_ISSUER: "code-inspector"
  SENDGRID_FROM_EMAIL: "no-reply@01sandbox.com"

secret:
  E2B_API_KEY: ""
  JWT_PRIVATE_KEY: ""   # Injected via: kubectl patch secret sandbox-api-secret -n sandbox
  JWT_PUBLIC_JWKS: ""   # Auto-derived from JWT_PRIVATE_KEY if left empty
  SENDGRID_API_KEY: ""

deployment:
  replicaCount: 1
  image:
    repository: 01community/01sandbox-api
    tag: "1.0.1"
    pullPolicy: Always
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: sandbox-api.local
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

postgresql:
  enabled: false
  host: "postgresql-service"
  port: 5432
  user: "postgres"
  password: "password123"
  database: "apikeys"
  storage: "5Gi"
  storageClassName: "standard"

redis:
  enabled: false
  host: "redis-service"
  port: 6379
  password: ""

rabbitmq:
  enabled: false
  host: "rabbitmq-service"
  port: 5672
  user: "admin"
  password: "changeme"
  maxQuickScanWorkers: "5"
  maxRepoScanWorkers: "3"
