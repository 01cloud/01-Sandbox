{{- if and .Values.ingressRoute .Values.ingressRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-route
  namespace: {{ .Values.agentgatewayNamespace | default "agentgateway-system" }}
spec:
  hostnames:
    {{- if .Values.ingressHostnames }}
    {{- range .Values.ingressHostnames }}
    - {{ . | quote }}
    {{- end }}
    {{- else if .Values.ingressHost }}
    - {{ .Values.ingressHost | quote }}
    {{- end }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.agentgatewayServiceName | default "agentgateway-proxy" }}
      namespace: {{ .Values.agentgatewayNamespace | default "agentgateway-system" }}
  rules:
    # 1. Direct /metric and /metrics to federated raw metrics of all scraped targets
    - matches:
        - path:
            type: Exact
            value: /metric
        - path:
            type: Exact
            value: /metrics
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: "/federate?match%5B%5D=%7Bjob%3D~%22.%2B%22%7D"
            statusCode: 302

    # 2. Raw scrape endpoints, Prometheus UI, and API
    - matches:
        - path:
            type: PathPrefix
            value: /federate
        - path:
            type: PathPrefix
            value: /api/v1/query
        - path:
            type: PathPrefix
            value: /api/v1/query_range
        - path:
            type: PathPrefix
            value: /api/v1/series
        - path:
            type: PathPrefix
            value: /api/v1/labels
        - path:
            type: PathPrefix
            value: /api/v1/label
        - path:
            type: PathPrefix
            value: /api/v1/targets
        - path:
            type: PathPrefix
            value: /graph
        - path:
            type: PathPrefix
            value: /targets
        - path:
            type: PathPrefix
            value: /rules
        - path:
            type: PathPrefix
            value: /static
        - path:
            type: PathPrefix
            value: {{ .Values.ingressPath | default "/prometheus" | quote }}
      backendRefs:
        - name: prometheus-service
          namespace: {{ .Values.namespace }}
          port: {{ .Values.service.port | default 9090 }}
{{- end }}
