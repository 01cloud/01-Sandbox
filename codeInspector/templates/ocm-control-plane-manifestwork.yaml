{{- if and .Values.global .Values.global.ocm .Values.global.ocm.enabled (eq (default "hub" .Values.global.ocm.role) "hub") }}
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: deploy-01sandbox-control-plane
  namespace: {{ default "primaryhub" .Values.global.ocm.primaryHub }}
  labels:
    {{- include "codeInspector.labels" . | nindent 4 }}
spec:
  workload:
    manifests:
      # 1. OpenSandbox Core Namespace
      - apiVersion: v1
        kind: Namespace
        metadata:
          name: {{ default "opensandbox-system" .Values.opensandbox.namespace }}
          labels:
            app.kubernetes.io/part-of: 01sandbox
            ocm.opensandbox.io/role: hub

      # 2. Redis Cache Service
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: redis-service
          namespace: {{ default "opensandbox-system" .Values.opensandbox.namespace }}
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: redis
          template:
            metadata:
              labels:
                app: redis
            spec:
              containers:
                - name: redis
                  image: redis:7-alpine
                  ports:
                    - containerPort: 6379

      # 3. RabbitMQ Message Broker
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: rabbitmq-service
          namespace: {{ default "opensandbox-system" .Values.opensandbox.namespace }}
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: rabbitmq
          template:
            metadata:
              labels:
                app: rabbitmq
            spec:
              containers:
                - name: rabbitmq
                  image: rabbitmq:3-management-alpine
                  ports:
                    - containerPort: 5672
                    - containerPort: 15672

      # 4. PostgreSQL Relational Store
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: postgresql-service
          namespace: {{ default "opensandbox-system" .Values.opensandbox.namespace }}
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: postgresql
          template:
            metadata:
              labels:
                app: postgresql
            spec:
              containers:
                - name: postgresql
                  image: postgres:15-alpine
                  env:
                    - name: POSTGRES_DB
                      value: "apikeys"
                    - name: POSTGRES_USER
                      value: "postgres"
                    - name: POSTGRES_PASSWORD
                      value: "password123"
                  ports:
                    - containerPort: 5432

      # 5. opensandbox-server Deployment (OCM Multi-Cluster Scheduler)
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: opensandbox-server
          namespace: {{ default "opensandbox-system" .Values.opensandbox.namespace }}
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: opensandbox-server
          template:
            metadata:
              labels:
                app: opensandbox-server
            spec:
              containers:
                - name: opensandbox-server
                  image: {{ .Values.opensandbox.server.image.repository }}:{{ .Values.opensandbox.server.image.tag }}
                  ports:
                    - containerPort: 8080
                  env:
                    - name: WORKLOAD_PROVIDER
                      value: "ocm"
                    - name: PLACEMENT_NAME
                      value: {{ default "sandbox-spoke-placement" .Values.global.ocm.placementName | quote }}
{{- end }}
