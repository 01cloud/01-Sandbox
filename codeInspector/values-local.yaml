    storageClassName: "standard"
  redis:
    enabled: true
    host: "redis-service"
    port: 6379
    password: ""
  rabbitmq:
    enabled: true
    host: "rabbitmq-service"
    port: 5672
    user: "admin"
    password: "changeme"
    maxQuickScanWorkers: "1"
    maxRepoScanWorkers: "1"
################################################################
# MetalLB component values
################################################################
metallb:
  enabled: true
  namespace: metallb-system
  ipAddressPool:
    addresses:
      # - 172.18.0.200-172.18.0.250
      - 10.0.8.9-10.0.8.9
  l2Advertisement:
    enabled: true

################################################################
# OpenSandbox component values
################################################################
opensandbox:
  enabled: true
  namespace: opensandbox-system
  controller:
    replicaCount: 1
    image:
      repository: 199012118961/01sandbox-opensandbox-controller
      tag: "dev"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  server:
    replicaCount: 1
    sandboxImage: "199012118961/01sandbox-codeinterpreter:dev"
    scannerImagePython: "199012118961/01sandbox-scanner-python:dev"
    scannerImageGo: "199012118961/01sandbox-scanner-go:dev"
    scannerImageJava: "199012118961/01sandbox-scanner-java:dev"
    scannerImageNode: "199012118961/01sandbox-scanner-node:dev"
    scannerImageK8s: "199012118961/01sandbox-scanner-k8s:dev"
    scannerImageRust: "199012118961/01sandbox-scanner-rust:dev"
    scannerImageCpp: "199012118961/01sandbox-scanner-cpp:dev"
    scannerImageRuby: "199012118961/01sandbox-scanner-ruby:dev"
    sandboxCpu: "200m"
    sandboxMemory: "256Mi"
    sandboxCreateTimeoutSeconds: 600
    autoTerminationSeconds: 0
    runtimeClassName: "gvisor"
    image:
      repository: 01community/01sandbox-opensandbox-server
      tag: "v0.7.10-ocm"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    storage:
      enabled: true
      pvcName: "scan-pvc"
      size: "10Gi"
      accessMode: "ReadWriteMany"
      mountPath: "/data"
      storageClassName: "standard"
################################################################
# OpenSandbox Resource Pool component values
################################################################
opensandboxResourcePool:
  enabled: false
  namespace: opensandbox-system
  pool:
    name: my-sandbox-pool
    container:
      image: "199012118961/01sandbox-codeinterpreter:dev"
      ports:
        - containerPort: 44772
        - containerPort: 54321
    capacitySpec:
      bufferMin: 3
      bufferMax: 10
      poolMin: 1
      poolMax: 50
###############################################################
# Prometheus component values
###############################################################
prometheus:
  enabled: false
  namespace: monitoring
  apiServerNamespace: opensandbox-system
  apiServerServiceName: sandbox-api-service
  apiServerPort: 80
  agentgatewayNamespace: agentgateway-system
  agentgatewayServiceName: agentgateway-proxy
  agentgatewayPort: 80
  replicaCount: 1
  ingressRoute:
    enabled: true
  ingressHostnames:
    - api-sandbox.01security.com
    - 10.0.8.9
  ingressPath: "/prometheus"
  image:
    repository: prom/prometheus
    tag: "v2.54.1"
    pullPolicy: IfNotPresent
  persistence:
    enabled: false
    pvcName: "prometheus-pvc"
  service:
    type: ClusterIP
    port: 9090
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
###############################################################
# Grafana component values
###############################################################
grafana:
  enabled: false
  namespace: monitoring
  prometheusNamespace: monitoring
  prometheusServiceName: prometheus-service
  prometheusPort: 9090
  replicaCount: 1
  ingressRoute:
    enabled: true
  ingressHost: "api-sandbox.01security.com"
  ingressHostnames:
    - api-sandbox.01security.com
    - 10.0.8.9
  ingressPath: "/grafana"
  image:
    repository: grafana/grafana
    tag: "11.1.0"
    pullPolicy: IfNotPresent
  persistence:
    enabled: false
    pvcName: "grafana-pvc"
  service:
    type: NodePort
    port: 3000
    nodePort: 32000
  adminPassword: "admin"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
###############################################################
# Sealed Secrets subchart controller values
###############################################################
sealed-secrets:
  enabled: false
