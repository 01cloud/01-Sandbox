{{- if and .Values.auth .Values.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-web-config
  namespace: {{ .Values.namespace }}
  labels:
    app: prometheus
type: Opaque
stringData:
  web.yml: |
    basic_auth_users:
      {{ .Values.auth.remoteWrite.username }}: {{ .Values.auth.remoteWrite.hashedPassword | quote }}
{{- end }}
