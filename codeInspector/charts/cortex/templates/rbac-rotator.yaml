apiVersion: v1
kind: ServiceAccount
metadata:
  name: cortex-auth-rotator
  namespace: {{ .Release.Namespace }}
  labels:
    app: cortex
    component: secret-rotator
---
apiVersion: v1
kind: Secret
metadata:
  name: cortex-auth-rotator-token
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/service-account.name: cortex-auth-rotator
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cortex-auth-rotator-role
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cortex-auth-secret"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cortex-auth-rotator-binding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cortex-auth-rotator-role
subjects:
  - kind: ServiceAccount
    name: cortex-auth-rotator
    namespace: {{ .Release.Namespace }}
