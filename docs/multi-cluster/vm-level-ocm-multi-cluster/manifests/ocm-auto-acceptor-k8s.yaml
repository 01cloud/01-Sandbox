apiVersion: v1
kind: Namespace
metadata:
  name: open-cluster-management-auto-acceptor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ocm-auto-acceptor-sa
  namespace: open-cluster-management-auto-acceptor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ocm-auto-acceptor-role
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["certificatesigningrequests", "certificatesigningrequests/approval"]
  verbs: ["get", "list", "watch", "update", "patch", "create", "delete"]
- apiGroups: ["certificates.k8s.io"]
  resources: ["signers"]
  resourceNames: ["kubernetes.io/kube-apiserver-client"]
  verbs: ["approve"]
- apiGroups: ["cluster.open-cluster-management.io"]
  resources: ["managedclusters", "managedclusters/status", "managedclusters/accept"]
  verbs: ["get", "list", "watch", "update", "patch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ocm-auto-acceptor-binding
subjects:
- kind: ServiceAccount
  name: ocm-auto-acceptor-sa
  namespace: open-cluster-management-auto-acceptor
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ocm-auto-acceptor-script
  namespace: open-cluster-management-auto-acceptor
data:
  auto-acceptor.sh: |
    #!/bin/sh
    echo "[$(date -Iseconds)] Starting OCM Priority Auto-Acceptor Loop in Kubernetes..."
    # WireGuard Overlay IP of PrimaryHub (cluster: primaryhub)
    PRIMARY_HUB_WG_IP="${PRIMARY_HUB_WG_IP:-${PRIMARY_HUB:-__PRIMARY_HUB_WG_IP__}}"

    while true; do
      NODE_NAME=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
      if echo "$NODE_NAME" | grep -q "secondaryhub"; then
        IS_SECONDARY=true
      else
        IS_SECONDARY=false
      fi

      if curl -k -m 2 -s https://${PRIMARY_HUB_WG_IP}:6443/livez >/dev/null 2>&1; then
        PRIMARY_ALIVE=true
      else
        PRIMARY_ALIVE=false
      fi

      if [ "$IS_SECONDARY" = "true" ] && [ "$PRIMARY_ALIVE" = "true" ]; then
        for spoke in $(kubectl get managedcluster -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          CURRENT_STATUS=$(kubectl get managedcluster "$spoke" -o jsonpath='{.status.conditions[?(@.type=="ManagedClusterConditionAvailable")].status}' 2>/dev/null)
          CURRENT_ACCEPT=$(kubectl get managedcluster "$spoke" -o jsonpath='{.spec.hubAcceptsClient}' 2>/dev/null)

          if [ "$CURRENT_STATUS" = "True" ] || [ "$CURRENT_ACCEPT" = "true" ]; then
            echo "[$(date -Iseconds)] Primary Hub is UP. Setting hubAcceptsClient=false & AVAILABLE=False for $spoke"
            kubectl patch managedcluster "$spoke" --type merge -p '{"spec":{"hubAcceptsClient":false}}' 2>/dev/null || true
            kubectl get managedcluster "$spoke" -o json 2>/dev/null | jq '
              .status.conditions = [
                (.status.conditions[]? | select(.type != "ManagedClusterConditionAvailable")),
                {
                  "type": "ManagedClusterConditionAvailable",
                  "status": "False",
                  "reason": "SecondaryStandby",
                  "message": "Primary hub is active; secondary hub in standby",
                  "lastTransitionTime": (now | todate)
                }
              ]
            ' | kubectl replace --subresource=status -f - 2>/dev/null || true
          fi
        done
      else
        PENDING_CSRS=$(kubectl get csr -o json 2>/dev/null | jq -r '.items[]? | select(.status.conditions == null and (.spec.signerName == "kubernetes.io/kube-apiserver-client" or .spec.signerName == "open-cluster-management.io/sub-k8s-signer")) | .metadata.name')
        for csr in $PENDING_CSRS; do
          if [ -n "$csr" ]; then
            echo "[$(date -Iseconds)] Auto-approving pending CSR: $csr"
            kubectl certificate approve "$csr" 2>/dev/null || true
          fi
        done

        for spoke in $(kubectl get managedcluster -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
          CURRENT_ACCEPT=$(kubectl get managedcluster "$spoke" -o jsonpath='{.spec.hubAcceptsClient}' 2>/dev/null)
          CURRENT_STATUS=$(kubectl get managedcluster "$spoke" -o jsonpath='{.status.conditions[?(@.type=="ManagedClusterConditionAvailable")].status}' 2>/dev/null)

          if [ "$CURRENT_ACCEPT" != "true" ]; then
            echo "[$(date -Iseconds)] Auto-accepting managedcluster: $spoke"
            kubectl patch managedcluster "$spoke" --type merge -p '{"spec":{"hubAcceptsClient":true}}' 2>/dev/null || true
          fi

          if [ "$CURRENT_STATUS" != "True" ]; then
            echo "[$(date -Iseconds)] Restoring AVAILABLE=True for $spoke"
            kubectl get managedcluster "$spoke" -o json 2>/dev/null | jq '
              .status.conditions = [
                (.status.conditions[]? | select(.type != "ManagedClusterConditionAvailable")),
                {
                  "type": "ManagedClusterConditionAvailable",
                  "status": "True",
                  "reason": "ManagedClusterAvailable",
                  "message": "Managed cluster is available",
                  "lastTransitionTime": (now | todate)
                }
              ]
            ' | kubectl replace --subresource=status -f - 2>/dev/null || true
          fi
        done
      fi

      APPROVED_CSRS=$(kubectl get csr -o json 2>/dev/null | jq -r '.items[]? | select(.status.conditions[]?.type == "Approved") | .metadata.name')
      CSR_COUNT=$(echo "$APPROVED_CSRS" | wc -w)
      if [ "$CSR_COUNT" -gt 5 ]; then
        for csr in $APPROVED_CSRS; do
          kubectl delete csr "$csr" 2>/dev/null || true
        done
      fi

      sleep 3
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocm-auto-acceptor
  namespace: open-cluster-management-auto-acceptor
  labels:
    app: ocm-auto-acceptor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocm-auto-acceptor
  template:
    metadata:
      labels:
        app: ocm-auto-acceptor
    spec:
      serviceAccountName: ocm-auto-acceptor-sa
      containers:
      - name: auto-acceptor
        image: bitnami/kubectl:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PRIMARY_HUB
          value: "__PRIMARY_HUB_IP__"
        command: ["/bin/sh", "/scripts/auto-acceptor.sh"]
        volumeMounts:
        - name: script-vol
          mountPath: /scripts
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: script-vol
        configMap:
          name: ocm-auto-acceptor-script
          defaultMode: 0755
