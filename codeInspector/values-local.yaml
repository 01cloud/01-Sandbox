      repository: 199012118961/01sandbox-api
      tag: "dev"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
  service:
    type: NodePort
    port: 80
    targetPort: 8000
    nodePort: 30080
  ingress:
    enabled: false
    className: nginx
    host: api-sandbox.01security.com
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  postgresql:
    enabled: true
    host: "postgresql-service"
    port: 5432
    user: "postgres"
    password: "password123"
