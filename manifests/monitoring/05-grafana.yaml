---
# =====================================================================
# Centralized Grafana – Deployed ONLY on kind-primaryhub
# =====================================================================
# Datasources (all via WireGuard overlay 10.99.0.0/24):
#   primaryhub   → http://prometheus-scraper.monitoring.svc:9090  (local, ClusterIP)
#   secondaryhub → http://10.99.0.2:30900
#   spoke1       → http://10.99.0.3:30900
#   spoke2       → http://10.99.0.4:30900
#   spoke3       → http://10.99.0.5:30900
#
# Each datasource has a matching uid so dashboard panels can reference
# them by cluster name in variables ($cluster datasource variable).
#
# Access: kubectl port-forward svc/grafana 3000:3000 -n monitoring
# Default credentials: admin / sandbox-admin
# =====================================================================

# ─── Grafana Datasources ConfigMap ───────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # ── Local: primaryhub ────────────────────────────────────────────────────
      - name: "primaryhub"
        uid: "prometheus-primaryhub"
        type: prometheus
        url: "http://prometheus-scraper.monitoring.svc.cluster.local:9090"
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: "15s"
          httpMethod: GET
        editable: false

      # ── Remote: secondaryhub (via WireGuard) ─────────────────────────────────
      - name: "secondaryhub"
        uid: "prometheus-secondaryhub"
        type: prometheus
        url: "http://10.99.0.2:30900"
        access: proxy
        isDefault: false
        jsonData:
          timeInterval: "15s"
          httpMethod: GET
        editable: false

      # ── Remote: spoke1 (via WireGuard) ───────────────────────────────────────
      - name: "spoke1"
        uid: "prometheus-spoke1"
        type: prometheus
        url: "http://10.99.0.3:30900"
        access: proxy
        isDefault: false
        jsonData:
          timeInterval: "15s"
          httpMethod: GET
        editable: false

      # ── Remote: spoke2 (via WireGuard) ───────────────────────────────────────
      - name: "spoke2"
        uid: "prometheus-spoke2"
        type: prometheus
        url: "http://10.99.0.4:30900"
        access: proxy
        isDefault: false
        jsonData:
          timeInterval: "15s"
          httpMethod: GET
        editable: false

      # ── Remote: spoke3 (via WireGuard) ───────────────────────────────────────
      - name: "spoke3"
        uid: "prometheus-spoke3"
        type: prometheus
        url: "http://10.99.0.5:30900"
        access: proxy
        isDefault: false
        jsonData:
          timeInterval: "15s"
          httpMethod: GET
        editable: false
---
# ─── Grafana Dashboard Provisioning ConfigMap ────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app: grafana
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: "01sandbox-multi-cluster"
        orgId: 1
        folder: "01-Sandbox"
        type: file
        disableDeletion: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
# ─── Multi-Cluster Overview Dashboard ────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-multicluster
  namespace: monitoring
  labels:
    app: grafana
data:
  multi-cluster-overview.json: |
    {
      "title": "01-Sandbox Multi-Cluster Overview",
      "uid": "01sandbox-overview",
      "tags": ["multi-cluster", "01sandbox"],
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 38,
      "templating": {
        "list": [
          {
            "name": "cluster",
            "label": "Cluster",
            "type": "datasource",
            "pluginId": "prometheus",
            "multi": true,
            "includeAll": true,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Prometheus Scraper Health (all clusters)",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 24, "h": 3 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${cluster}" },
              "expr": "up",
              "legendFormat": "{{cluster}} / {{job}}",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "1": { "text": "UP", "color": "green" }, "0": { "text": "DOWN", "color": "red" } } }
              ],
              "thresholds": { "mode": "absolute", "steps": [{"color":"red","value":0},{"color":"green","value":1}] }
            }
          }
        },
        {
          "id": 2,
          "title": "Pod Restart Count (all clusters)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 3, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-primaryhub" },
              "expr": "increase(kube_pod_container_status_restarts_total[1h])",
              "legendFormat": "primaryhub / {{namespace}}/{{pod}}",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-secondaryhub" },
              "expr": "increase(kube_pod_container_status_restarts_total[1h])",
              "legendFormat": "secondaryhub / {{namespace}}/{{pod}}",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-spoke1" },
              "expr": "increase(kube_pod_container_status_restarts_total[1h])",
              "legendFormat": "spoke1 / {{namespace}}/{{pod}}",
              "refId": "C"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-spoke2" },
              "expr": "increase(kube_pod_container_status_restarts_total[1h])",
              "legendFormat": "spoke2 / {{namespace}}/{{pod}}",
              "refId": "D"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-spoke3" },
              "expr": "increase(kube_pod_container_status_restarts_total[1h])",
              "legendFormat": "spoke3 / {{namespace}}/{{pod}}",
              "refId": "E"
            }
          ]
        },
        {
          "id": 3,
          "title": "PostgreSQL Replication Lag (primaryhub → secondaryhub)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 3, "w": 12, "h": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-primaryhub" },
              "expr": "cnpg_pg_replication_lag",
              "legendFormat": "replication_lag_seconds",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-primaryhub" },
              "expr": "cnpg_pg_stat_replication_stream_replay_lag_bytes / 1048576",
              "legendFormat": "replay_lag_MB",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "overrides": [
              { "matcher": { "id": "byName", "options": "replay_lag_MB" }, "properties": [{"id":"unit","value":"MB"}] },
              { "matcher": { "id": "byName", "options": "replication_lag_seconds" }, "properties": [{"id":"unit","value":"s"}] }
            ]
          }
        },
        {
          "id": 4,
          "title": "OCM Webhook Admission Success Rate – primaryhub",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 11, "w": 12, "h": 7 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-primaryhub" },
              "expr": "sum(rate(controller_runtime_webhook_requests_total{code=\"200\"}[5m])) / sum(rate(controller_runtime_webhook_requests_total[5m]))",
              "legendFormat": "primaryhub admission success rate",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-secondaryhub" },
              "expr": "sum(rate(controller_runtime_webhook_requests_total{code=\"200\"}[5m])) / sum(rate(controller_runtime_webhook_requests_total[5m]))",
              "legendFormat": "secondaryhub admission success rate",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1 } }
        },
        {
          "id": 5,
          "title": "OCM Klusterlet Health – all spokes",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 11, "w": 12, "h": 7 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-spoke1" },
              "expr": "up{job=\"open-cluster-management-agent\"}",
              "legendFormat": "spoke1 klusterlet",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-spoke2" },
              "expr": "up{job=\"open-cluster-management-agent\"}",
              "legendFormat": "spoke2 klusterlet",
              "refId": "B"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-spoke3" },
              "expr": "up{job=\"open-cluster-management-agent\"}",
              "legendFormat": "spoke3 klusterlet",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "1": {"text":"UP","color":"green"}, "0": {"text":"DOWN","color":"red"} } }
              ]
            }
          }
        },
        {
          "id": 6,
          "title": "Controller Workqueue Depth (all hubs)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 18, "w": 12, "h": 7 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-primaryhub" },
              "expr": "sum(workqueue_depth) by (name)",
              "legendFormat": "primaryhub / {{name}}",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-secondaryhub" },
              "expr": "sum(workqueue_depth) by (name)",
              "legendFormat": "secondaryhub / {{name}}",
              "refId": "B"
            }
          ]
        },
        {
          "id": 7,
          "title": "PostgreSQL Active Connections",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 18, "w": 12, "h": 7 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-primaryhub" },
              "expr": "cnpg_pg_stat_activity_connections",
              "legendFormat": "primaryhub / {{datname}}",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus-secondaryhub" },
              "expr": "cnpg_pg_stat_activity_connections",
              "legendFormat": "secondaryhub / {{datname}}",
              "refId": "B"
            }
          ]
        }
      ],
      "time": { "from": "now-1h", "to": "now" }
    }
---
# ─── Grafana Main ConfigMap (grafana.ini) ─────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
  labels:
    app: grafana
data:
  grafana.ini: |
    [server]
    root_url = http://localhost:3000
    [security]
    admin_user = admin
    admin_password = sandbox-admin
    [auth.anonymous]
    enabled = false
    [analytics]
    reporting_enabled = false
    check_for_updates = false
    [log]
    level = warn
---
# ─── Grafana Deployment ───────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "sandbox-admin"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: grafana-config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: grafana-storage
              mountPath: /var/lib/grafana
      volumes:
        - name: grafana-config
          configMap:
            name: grafana-config
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboard-multicluster
        - name: grafana-storage
          emptyDir: {}
---
# ─── Grafana Service ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
