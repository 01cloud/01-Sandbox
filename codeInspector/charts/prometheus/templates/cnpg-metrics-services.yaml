{{- if and .Values.cnpgMetrics .Values.cnpgMetrics.enabled }}
---
# =====================================================================
# CloudNative-PG Metrics ClusterIP Services
# Only rendered on hub clusters that run PostgreSQL.
# Gated by: prometheus.cnpgMetrics.enabled (default: true on hubs)
# =====================================================================

# Primary PostgreSQL Instance Metrics Service
apiVersion: v1
kind: Service
metadata:
  name: postgresql-primary-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgresql-primary-metrics
    app.kubernetes.io/component: database-metrics
    cnpg.io/cluster: postgresql-primary
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    cnpg.io/cluster: postgresql-primary
  ports:
  - name: metrics
    port: 9187
    targetPort: 9187
    protocol: TCP
{{- if and .Values.cnpgMetrics.secondary .Values.cnpgMetrics.secondary.enabled }}
---
# Secondary (Standby Replica) PostgreSQL Instance Metrics Service
apiVersion: v1
kind: Service
metadata:
  name: postgresql-secondary-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgresql-secondary-metrics
    app.kubernetes.io/component: database-metrics
    cnpg.io/cluster: postgresql-secondary
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    cnpg.io/cluster: postgresql-secondary
  ports:
  - name: metrics
    port: 9187
    targetPort: 9187
    protocol: TCP
{{- end }}
{{- end }}
