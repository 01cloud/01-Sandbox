namespace: monitoring

clusterName: "primaryhub"
clusterRole: "hub"
retention: "6h"

cnpgMetrics:
  enabled: true

apiServerNamespace: opensandbox-system
apiServerServiceName: sandbox-api-service
apiServerPort: 80

agentgatewayNamespace: agentgateway-system
agentgatewayServiceName: agentgateway-proxy
agentgatewayPort: 80

replicaCount: 1

image:
  repository: prom/prometheus
  tag: "v2.54.1"
  pullPolicy: IfNotPresent

persistence:
  enabled: false
  pvcName: "prometheus-pvc"

service:
  type: ClusterIP
  port: 9090
  nodePort:
    enabled: true
    port: 30900


resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
