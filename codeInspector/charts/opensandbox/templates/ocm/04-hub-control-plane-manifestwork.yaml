{{- if .Values.multiCluster.enabled }}
apiVersion: work.open-cluster-management.io/v1
kind: ManifestWork
metadata:
  name: deploy-01sandbox-control-plane
  namespace: primaryhub
spec:
  workload:
    manifests:
      # 1. Namespace
      - apiVersion: v1
        kind: Namespace
        metadata:
          name: {{ .Values.namespace }}
      # 2. Redis Deployment
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: redis
          namespace: {{ .Values.namespace }}
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: redis
          template:
            metadata:
              labels:
                app: redis
            spec:
              containers:
                - name: redis
                  image: redis:7-alpine
                  ports:
                    - containerPort: 6379
      # 3. RabbitMQ Deployment
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: rabbitmq
          namespace: {{ .Values.namespace }}
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: rabbitmq
          template:
            metadata:
              labels:
                app: rabbitmq
            spec:
              containers:
                - name: rabbitmq
                  image: rabbitmq:3-management-alpine
                  ports:
                    - containerPort: 5672
                    - containerPort: 15672
      # 4. opensandbox-server Deployment
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: opensandbox-server
          namespace: {{ .Values.namespace }}
        spec:
          replicas: {{ .Values.server.replicaCount | default 2 }}
          selector:
            matchLabels:
              app: opensandbox-server
          template:
            metadata:
              labels:
                app: opensandbox-server
            spec:
              containers:
                - name: opensandbox-server
                  image: {{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}
                  ports:
                    - containerPort: 80
                  env:
                    - name: WORKLOAD_PROVIDER
                      value: "ocm"
{{- end }}
