apiVersion: v1
kind: Pod
metadata:
  name: sample-07-dangerous-capabilities
spec:
  containers:
    - name: app
      image: ubuntu:latest
      securityContext:
        capabilities:
          add:
            - SYS_ADMIN       # VULN: kernel privilege for system admin (escape helper)
            - NET_ADMIN       # VULN: capability to modify routing / firewall rules
            - SYS_RAWIO       # VULN: raw access to physical memory / drives
            - SYS_PTRACE      # VULN: ptrace processes outside the container namespace
            - DAC_OVERRIDE    # VULN: bypass all OS-level read/write/execute checks
            - ALL             # VULN: adds all raw capabilities (worst-case capability)
