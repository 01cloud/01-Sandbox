{{- if and .Values.postgresql.enabled (not (and .Values.cnpg .Values.cnpg.enabled)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      terminationGracePeriodSeconds: 60
      {{- if and .Values.postgresql.replication .Values.postgresql.replication.enabled (eq .Values.postgresql.replication.role "standby") }}
      initContainers:
      - name: init-standby
        image: postgres:15-alpine
        command:
        - sh
        - -c
        - |
          set -e
          if [ ! -f /var/lib/postgresql/data/standby.signal ] && [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
            echo "Bootstrapping standby from primary {{ .Values.postgresql.replication.primaryHost }}:{{ .Values.postgresql.replication.primaryPort }}..."
            PGPASSWORD="{{ .Values.postgresql.password }}" pg_basebackup -h {{ .Values.postgresql.replication.primaryHost }} -p {{ .Values.postgresql.replication.primaryPort }} -U postgres -D /var/lib/postgresql/data -Fp -Xs -R
            echo "Standby bootstrapped successfully."
          else
            echo "Standby data directory already exists."
          fi
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: v3-data
      {{- end }}
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: {{ .Values.postgresql.user | quote }}
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sandbox-api-secret
              key: PG_PASSWORD
        - name: POSTGRES_DB
          value: {{ .Values.postgresql.database | quote }}
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - {{ .Values.postgresql.user | quote }}
            - -d
            - {{ .Values.postgresql.database | quote }}
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - {{ .Values.postgresql.user | quote }}
            - -d
            - {{ .Values.postgresql.database | quote }}
          initialDelaySeconds: 15
          periodSeconds: 10
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: v3-data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgresql.host }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: postgresql
  ports:
  - port: {{ .Values.postgresql.port }}
    targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: {{ .Values.namespace }}
spec:
  storageClassName: {{ .Values.postgresql.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgresql.storage }}
{{- end }}
