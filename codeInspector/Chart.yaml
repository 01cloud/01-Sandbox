apiVersion: v2
name: codeInspector
description: All-in-one Helm chart for deploying CodeInspector components
type: application
version: 0.1.0
appVersion: "1.0.0"
icon: https://raw.githubusercontent.com/cncf/artwork/main/projects/kubernetes/icon/color/kubernetes-icon-color.png
keywords:
  - codeinspector
  - kubernetes
  - sandbox
  - api
maintainers:
  - name: CodeInspector Team
dependencies:
  - name: agentgateway
    version: 0.1.0
    condition: agentgateway.enabled
  - name: agentgateway-controller
    version: v1.0.1
    condition: agentgateway-controller.enabled
  - name: apiServer
    version: 0.1.0
    condition: apiServer.enabled
  - name: prometheus
    version: 0.1.0
    condition: prometheus.enabled
  - name: grafana
    version: 0.1.0
    condition: grafana.enabled

#   - name: z1sandbox-website
#     version: 2.0.0
#     condition: z1sandbox-website.enabled
  - name: metallb
    version: 0.1.0
    condition: metallb.enabled
  - name: kindCluster
    version: 0.1.0
    condition: kindCluster.enabled
  - name: opensandboxResourcePool
    version: 0.1.0
    condition: opensandboxResourcePool.enabled
  - name: opensandbox
    version: 0.1.0
    condition: opensandbox.enabled
  - name: sealed-secrets
    version: 2.5.19
    condition: sealed-secrets.enabled
