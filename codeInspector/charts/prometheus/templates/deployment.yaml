apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: {{ .Values.namespace }}
  labels:
    app: prometheus
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time={{ .Values.retention | default "7d" }}"
            - "--web.enable-lifecycle"
            - "--web.enable-remote-write-receiver"
            - "--web.route-prefix=/"
            {{- if and .Values.auth .Values.auth.enabled }}
            - "--web.config.file=/etc/prometheus-web/web.yml"
            {{- end }}
            {{- if and .Values.ingressRoute .Values.ingressRoute.enabled }}
            - '--web.external-url={{ .Values.ingressPath | default "/prometheus" }}'
            {{- end }}
          ports:
            - containerPort: 9090
              name: web
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            {{- if and .Values.auth .Values.auth.enabled }}
            - name: web-config
              mountPath: /etc/prometheus-web
            {{- end }}
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        {{- if and .Values.auth .Values.auth.enabled }}
        - name: web-config
          secret:
            secretName: prometheus-web-config
        {{- end }}
        - name: storage
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.pvcName }}
          {{- else }}
          emptyDir: {}
          {{- end }}
