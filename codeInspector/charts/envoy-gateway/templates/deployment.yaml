apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "envoy-gateway.fullname" . }}
  namespace: {{ .Values.namespace | default "opensandbox-system" }}
  labels:
    {{- include "envoy-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "envoy-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "envoy-gateway.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
      - name: envoy
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - envoy
        - -c
        - /etc/envoy/envoy.yaml
        ports:
        - name: http
          containerPort: {{ .Values.service.httpPort | default 80 }}
          protocol: TCP
        - name: admin
          containerPort: {{ .Values.service.adminPort | default 9901 }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /ready
            port: admin
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: admin
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
          readOnly: true
      volumes:
      - name: envoy-config
        configMap:
          name: {{ include "envoy-gateway.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
