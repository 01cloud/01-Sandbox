apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: wireguardpeers.networking.opensandbox.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
  labels:
    app.kubernetes.io/name: wireguard-peer
    app.kubernetes.io/part-of: opensandbox
spec:
  group: networking.opensandbox.io
  names:
    kind: WireGuardPeer
    listKind: WireGuardPeerList
    plural: wireguardpeers
    singular: wireguardpeer
    shortNames:
      - wgp
      - wgpeer
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: WireGuardPeer defines a peer node in the cross-cluster WireGuard mesh.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: Specification of the WireGuard peer.
              type: object
              required:
                - clusterName
                - wireGuardIP
                - publicKey
              properties:
                clusterName:
                  type: string
                  description: The logical name of the cluster or node.
                region:
                  type: string
                  description: The AWS region where the cluster resides.
                wireGuardIP:
                  type: string
                  description: Overlay IP assigned in the 10.99.0.0/24 subnet.
                endpoint:
                  type: string
                  description: Public or Private IP address and UDP port of the WireGuard peer.
                publicKey:
                  type: string
                  description: The WireGuard public key for cryptographic handshake.
                persistentKeepalive:
                  type: integer
                  description: Interval in seconds to send keepalive packets.
                  default: 25
            status:
              description: Real-time observed status of the WireGuard connection.
              type: object
              properties:
                phase:
                  type: string
                  description: Phase of the peer connection (Active, Pending, Stale, Error).
                lastHandshakeTime:
                  type: string
                  description: ISO 8601 timestamp of the most recent successful WireGuard handshake.
                lastSynchronized:
                  type: string
                  description: Timestamp when the DaemonSet last verified or updated this peer.
                transferRxBytes:
                  type: integer
                  description: Total received bytes over the WireGuard tunnel.
                transferTxBytes:
                  type: integer
                  description: Total transmitted bytes over the WireGuard tunnel.
      additionalPrinterColumns:
        - name: Cluster
          type: string
          jsonPath: .spec.clusterName
        - name: WG-IP
          type: string
          jsonPath: .spec.wireGuardIP
        - name: Endpoint
          type: string
          jsonPath: .spec.endpoint
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
