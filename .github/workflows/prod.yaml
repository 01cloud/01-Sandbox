name: Promote to Live

on:
  push:
    branches: [main]
    paths:
      - 'apiServer/**'
      - 'code-interpreter/**'
      - 'opensandbox-server/**'
      - 'opensandbox-controller/**'
      - 'codeInspector/**'
      - '!codeInspector/values.yaml'
      - 'CHANGELOG.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release
    uses: 01cloud/actions/.github/workflows/release-please.yaml@main
    permissions:
      contents: write
      pull-requests: write

  filter:
    name: Filter Changes
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      api:        ${{ steps.filter.outputs.api }}
      scanner:    ${{ steps.filter.outputs.scanner }}
      server:     ${{ steps.filter.outputs.server }}
      controller: ${{ steps.filter.outputs.controller }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          filters: |
            api:
              - 'apiServer/**'
            scanner:
              - 'code-interpreter/**'
            server:
              - 'opensandbox-server/**'
            controller:
              - 'opensandbox-controller/**'

  build:
    name: Build
    needs: [release-please, filter]
    if: needs.release-please.outputs.release_created == 'true'
    uses: 01cloud/actions/.github/workflows/docker-build-multi.yaml@main
    with:
      version: ${{ needs.release-please.outputs.version }}
      components: |
        [
          {"name": "api",        "changed": "${{ needs.filter.outputs.api }}",        "context": "./apiServer/fastapi",                   "image": "01community/01sandbox-api"},
          {"name": "scanner",    "changed": "${{ needs.filter.outputs.scanner }}",    "context": "./code-interpreter",                    "image": "01community/01sandbox-codeinterpreter"},
          {"name": "server",     "changed": "${{ needs.filter.outputs.server }}",     "context": "./opensandbox-server/docker-build",     "image": "01community/01sandbox-opensandbox-server"},
          {"name": "controller", "changed": "${{ needs.filter.outputs.controller }}", "context": "./opensandbox-controller/docker-build",  "image": "01community/01sandbox-opensandbox-controller"}
        ]
    secrets:
      REGISTRY_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy:
    name: Deploy
    needs: [release-please, filter, build]
    if: |
      always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.build.result != 'failure'
    secrets: inherit
    uses: 01cloud/actions/.github/workflows/deploy-helm.yaml@main
    with:
      release-name: ${{ vars.HELM_RELEASE_NAME }}
      namespace: ${{ vars.K8S_NAMESPACE }}
      chart-path: ${{ vars.HELM_CHART_PATH }}
      values-files: ${{ vars.HELM_VALUES_FILES }}
      atomic: true
      timeout: 5m0s

  update-values:
    name: Update Values
    needs: [release-please, filter, deploy]
    if: needs.deploy.result == 'success'
    secrets: inherit
    uses: 01cloud/actions/.github/workflows/update-values.yaml@main
    with:
      version: ${{ needs.release-please.outputs.version }}
      values-file: ${{ vars.HELM_VALUES_FILES }}
      components: |
        [
          {"name": "api",        "changed": "${{ needs.filter.outputs.api }}",        "values-key": "apiServer.deployment.image.tag",   "value": "__VERSION__"},
          {"name": "scanner",    "changed": "${{ needs.filter.outputs.scanner }}",    "values-key": "opensandbox.server.sandboxImage",   "value": "01community/01sandbox-codeinterpreter:__VERSION__"},
          {"name": "server",     "changed": "${{ needs.filter.outputs.server }}",     "values-key": "opensandbox.server.image.tag",      "value": "__VERSION__"},
          {"name": "controller", "changed": "${{ needs.filter.outputs.controller }}", "values-key": "opensandbox.controller.image.tag",  "value": "__VERSION__"}
        ]
