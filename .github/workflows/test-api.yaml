## Test Pipeline
name: Test API Server

on:
  push:
    branches:
      - '**'
    paths:
      - 'apiServer/**'
      - '.github/**'

jobs:
  run-tests:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apiServer/fastapi/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apiServer/fastapi/requirements.txt

      - name: Run PostgreSQL Health Tests
        working-directory: apiServer/fastapi
        run: |
          pytest tests/postgresql/ --cov=health --cov-report=term-missing -v

      - name: Run Redis Health Tests
        working-directory: apiServer/fastapi
        run: |
          pytest tests/redis/ --cov=health --cov-report=term-missing -v

      - name: Run Ratelimit Tests
        working-directory: apiServer/fastapi
        run: |
          pytest tests/ratelimit/ --cov=ratelimit --cov-report=term-missing -v

      - name: Run Configuration Tests
        working-directory: apiServer/fastapi
        run: |
          pytest tests/config/ --cov=config --cov-report=term-missing -v
