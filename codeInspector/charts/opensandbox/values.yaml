namespace: opensandbox-system

controller:
  replicaCount: 1
  image:
    repository: opensandbox/controller
    tag: v1.0.0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  sandboxImage: "01community/01sandbox-codeinterpreter:1.0.0"

# Storage configuration for Scan Jobs
storage:
  enabled: true
  pvcName: "scan-pvc"
  size: "10Gi"
  accessMode: "ReadWriteOnce"
  mountPath: "/data"

server:
  replicaCount: 1
  workloadProvider: "ocm"
  placementName: "sandbox-spoke-placement"
  image:
    repository: opensandbox/server
    tag: v1.0.0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  sandboxImage: "01community/01sandbox-codeinterpreter:1.0.0"
  sandboxCreateTimeoutSeconds: 600
  autoTerminationSeconds: 0
  runtimeClassName: "gvisor"

# Multi-Cluster (OCM) Configuration
multiCluster:
  enabled: true
  clusterSet: "sandbox-spokes"
  placementName: "sandbox-spoke-placement"
  targetSpokes:
    - name: "spoke-us-east-1"
      region: "us-east-1"
    - name: "spoke-eu-central-1"
      region: "eu-central-1"
