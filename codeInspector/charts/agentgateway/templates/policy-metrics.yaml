apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: api-metrics-private-policy
  namespace: {{ .Values.namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: agentgateway-api-route
  traffic:
    authorization:
      action: Deny
      policy:
        matchExpressions:
          - '(request.path == "/metrics" || request.path == "/api/v1/01sbx/metrics") && (!source.address.startsWith("10.") && !source.address.startsWith("192.168.") && !source.address.startsWith("172.") && !source.address.startsWith("127.") && !source.address.startsWith("::1"))'
