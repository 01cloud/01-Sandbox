apiVersion: v1
kind: Service
metadata:
  name: {{ include "envoy-gateway.fullname" . }}
  namespace: {{ .Values.namespace | default "opensandbox-system" }}
  labels:
    {{- include "envoy-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "NodePort" }}
  ports:
  - port: {{ .Values.service.httpPort | default 80 }}
    targetPort: http
    protocol: TCP
    name: http
    {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
  - port: {{ .Values.service.adminPort | default 9901 }}
    targetPort: admin
    protocol: TCP
    name: admin
    {{- if and (eq .Values.service.type "NodePort") .Values.service.adminNodePort }}
    nodePort: {{ .Values.service.adminNodePort }}
    {{- end }}
  selector:
    {{- include "envoy-gateway.selectorLabels" . | nindent 4 }}
