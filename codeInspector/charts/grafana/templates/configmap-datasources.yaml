apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.namespace }}
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      {{- if .Values.datasources }}
      {{- toYaml .Values.datasources | nindent 6 }}
      {{- else }}
      # ── Local: primaryhub (Central TSDB for All Fleet Metrics) ───────────────
      - name: "primaryhub"
        uid: "prometheus-primaryhub"
        type: prometheus
        access: proxy
        url: http://{{ .Values.prometheusServiceName }}.{{ .Values.prometheusNamespace }}.svc.cluster.local:{{ .Values.prometheusPort }}
        isDefault: true
        jsonData:
          timeInterval: "15s"
          httpMethod: GET
        editable: false

      # ── Remote: secondaryhub (Central Ingestion via Push) ─────────────────────
      - name: "secondaryhub"
        uid: "prometheus-secondaryhub"
        type: prometheus
        url: http://{{ .Values.prometheusServiceName }}.{{ .Values.prometheusNamespace }}.svc.cluster.local:{{ .Values.prometheusPort }}
        access: proxy
        isDefault: false
        jsonData:
          timeInterval: "15s"
          httpMethod: GET
        editable: false
      {{- end }}
