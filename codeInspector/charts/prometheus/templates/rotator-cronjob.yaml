{{- if and .Values.rotator .Values.rotator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-secret-rotator
  namespace: {{ .Values.namespace }}
  labels:
    app: prometheus
    component: secret-rotator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-secret-rotator-role
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "pods", "pods/exec"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["work.open-cluster-management.io"]
    resources: ["manifestworks"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-secret-rotator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-secret-rotator-role
subjects:
  - kind: ServiceAccount
    name: prometheus-secret-rotator
    namespace: {{ .Values.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rotator-script
  namespace: {{ .Values.namespace }}
  labels:
    app: prometheus
    component: secret-rotator
data:
  rotate.py: |
    #!/usr/bin/env python3
    import os
    import sys
    import json
    import base64
    import string
    import secrets
    import time
    import hmac
    import hashlib
    import datetime
    import urllib.request
    import urllib.error
    import subprocess
    import warnings

    with warnings.catch_warnings():
        warnings.simplefilter("ignore", DeprecationWarning)
        import crypt

    NAMESPACE = os.environ.get("NAMESPACE", "opensandbox-system")
    PROMETHEUS_URL = os.environ.get("PROMETHEUS_URL", "http://prometheus-service.opensandbox-system.svc.cluster.local:9090")
    GRACE_PERIOD = int(os.environ.get("GRACE_PERIOD_SECONDS", "600"))

    def run_cmd(cmd):
        result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True, check=True)
        return result.stdout.strip()

    def put_ssm_parameter(name, value, param_type="String", region="us-east-1"):
        access_key = os.environ.get("AWS_ACCESS_KEY_ID")
        secret_key = os.environ.get("AWS_SECRET_ACCESS_KEY")
        session_token = os.environ.get("AWS_SESSION_TOKEN")
        if not access_key or not secret_key:
            print("[-] AWS credentials not configured in environment; skipping SSM sync.")
            return False

        def sign(key, msg):
            return hmac.new(key, msg.encode("utf-8"), hashlib.sha256).digest()

        def get_signature_key(key, date_stamp, region_name, service_name):
            k_date = sign(("AWS4" + key).encode("utf-8"), date_stamp)
            k_region = sign(k_date, region_name)
            k_service = sign(k_region, service_name)
            k_signing = sign(k_service, "aws4_request")
            return k_signing

        t = datetime.datetime.now(datetime.timezone.utc)
        amz_date = t.strftime("%Y%m%dT%H%M%SZ")
        date_stamp = t.strftime("%Y%m%d")
        host = f"ssm.{region}.amazonaws.com"
        endpoint = f"https://{host}/"

        payload = json.dumps({
            "Name": name,
            "Value": value,
            "Type": param_type,
            "Overwrite": True
        })

        target = "AmazonSSM.PutParameter"
        canonical_headers = f"content-type:application/x-amz-json-1.1\nhost:{host}\nx-amz-date:{amz_date}\n"
        signed_headers = "content-type;host;x-amz-date"
        if session_token:
            canonical_headers += f"x-amz-security-token:{session_token}\n"
            signed_headers += ";x-amz-security-token"
        canonical_headers += f"x-amz-target:{target}\n"
        signed_headers += ";x-amz-target"

        payload_hash = hashlib.sha256(payload.encode("utf-8")).hexdigest()
        canonical_request = f"POST\n/\n\n{canonical_headers}\n{signed_headers}\n{payload_hash}"

        algorithm = "AWS4-HMAC-SHA256"
        credential_scope = f"{date_stamp}/{region}/ssm/aws4_request"
        string_to_sign = f"{algorithm}\n{amz_date}\n{credential_scope}\n{hashlib.sha256(canonical_request.encode('utf-8')).hexdigest()}"

        signing_key = get_signature_key(secret_key, date_stamp, region, "ssm")
        signature = hmac.new(signing_key, string_to_sign.encode("utf-8"), hashlib.sha256).hexdigest()

        authorization_header = f"{algorithm} Credential={access_key}/{credential_scope}, SignedHeaders={signed_headers}, Signature={signature}"

        req = urllib.request.Request(endpoint, data=payload.encode("utf-8"))
        req.add_header("Content-Type", "application/x-amz-json-1.1")
        req.add_header("X-Amz-Target", target)
        req.add_header("X-Amz-Date", amz_date)
        if session_token:
            req.add_header("X-Amz-Security-Token", session_token)
        req.add_header("Authorization", authorization_header)

        try:
            with urllib.request.urlopen(req, timeout=15) as resp:
                data = json.loads(resp.read().decode("utf-8"))
                print(f"[+] Synced {name} ({param_type}) to AWS SSM Parameter Store (version {data.get('Version')}).")
                return True
        except Exception as e:
            print(f"[!] Failed to sync {name} to AWS SSM Parameter Store: {e}")
            return False

    print("=================================================================")
    print("  Kubernetes-Native Prometheus Push-Based Secret Rotator")
    print("=================================================================")

    # 1. Generate new credentials
    timestamp = time.strftime("%Y%m%d%H%M")
    new_user = f"prom-rw-{timestamp}"
    alphabet = string.ascii_letters + string.digits
    new_pass = "".join(secrets.choice(alphabet) for _ in range(24))
    new_hash = crypt.crypt(new_pass, crypt.mksalt(crypt.METHOD_BLOWFISH))
    print(f"[*] Generated new credential ID: {new_user}")

    # 2. Retrieve current secret
    print(f"[*] Fetching current prometheus-web-config from namespace {NAMESPACE}...")
    secret_json = json.loads(run_cmd(["kubectl", "-n", NAMESPACE, "get", "secret", "prometheus-web-config", "-o", "json"]))
    raw_web_yml = base64.b64decode(secret_json["data"]["web.yml"]).decode("utf-8")

    # Parse existing users
    lines = raw_web_yml.strip().split("\n")
    users = {}
    for line in lines:
        line = line.strip()
        if ":" in line and not line.startswith("basic_auth_users"):
            parts = line.split(":", 1)
            u = parts[0].strip()
            h = parts[1].strip().strip('"').strip("'")
            users[u] = h

    print(f"[*] Current active user(s): {list(users.keys())}")

    # 3. Phase 1: Activate Dual-Authentication on PrimaryHub
    print("[*] Phase 1: Adding new user to PrimaryHub web.yml (Dual-Auth Overlap)...")
    users[new_user] = new_hash
    updated_web_yml = "basic_auth_users:\n" + "\n".join([f'  {u}: "{h}"' for u, h in users.items()]) + "\n"

    patch_payload = {
        "data": {
            "web.yml": base64.b64encode(updated_web_yml.encode("utf-8")).decode("utf-8")
        }
    }
    run_cmd(["kubectl", "-n", NAMESPACE, "patch", "secret", "prometheus-web-config", "--type=merge", "-p", json.dumps(patch_payload)])
    print("[+] PrimaryHub secret patched with dual users.")

    # Hot-reload PrimaryHub Prometheus
    # Note: Kubelet updates mounted secrets asynchronously (~5-10s). We poll /etc/prometheus-web/web.yml or wait 10s.
    print("[*] Waiting 10s for kubelet secret volume propagation...")
    time.sleep(10)

    # 4. Trigger hot-reload on PrimaryHub Prometheus
    print("[*] Triggering hot-reload on PrimaryHub Prometheus via SIGHUP...")
    try:
        # SIGHUP reloads Prometheus instantaneously (<30ms) without container restart or auth overhead
        reload_cmd = [
            "kubectl", "-n", NAMESPACE, "exec", "deploy/prometheus", "--",
            "kill", "-HUP", "1"
        ]
        run_cmd(reload_cmd)
        print("[+] PrimaryHub Prometheus reloaded successfully. Dual-auth is now LIVE.")
    except Exception as e:
        print(f"[!] Warning: reload trigger returned: {e}")

    # 5. Phase 2: Distribute new credentials to Spoke clusters via OCM ManifestWork
    print("[*] Phase 2: Distributing new credentials to edge spoke clusters via OCM...")
    try:
        spokes = run_cmd(["kubectl", "get", "managedclusters", "-o", "jsonpath={.items[*].metadata.name}"]).split()
        for spoke in spokes:
            if not spoke:
                continue
            print(f"    -> Updating Spoke: {spoke}...")
            manifest_work = {
                "apiVersion": "work.open-cluster-management.io/v1",
                "kind": "ManifestWork",
                "metadata": {
                    "name": "spoke-prometheus-auth",
                    "namespace": spoke
                },
                "spec": {
                    "workload": {
                        "manifests": [
                            {
                                "apiVersion": "v1",
                                "kind": "Secret",
                                "metadata": {
                                    "name": "prometheus-remote-write-auth",
                                    "namespace": "monitoring"
                                },
                                "type": "Opaque",
                                "stringData": {
                                    "username": new_user,
                                    "password": new_pass
                                }
                            }
                        ]
                    }
                }
            }
            p = subprocess.Popen(["kubectl", "apply", "-f", "-"], stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
            out, err = p.communicate(input=json.dumps(manifest_work))
            if p.returncode == 0:
                print(f"       [OK] Applied ManifestWork to {spoke}.")
            else:
                print(f"       [!] Failed to apply ManifestWork to {spoke}: {err}")
    except Exception as e:
        print(f"[!] Warning: OCM distribution error: {e}")

    # 6. Also sync to AWS SSM Parameter Store (for newly launched EC2 spokes)
    try:
        print("[*] Syncing new credentials to AWS SSM Parameter Store (/sandbox/monitoring/rw-*)...")
        reg = os.environ.get("AWS_REGION", "us-east-1")
        ok_user = put_ssm_parameter("/sandbox/monitoring/rw-username", new_user, "String", region=reg)
        ok_pass = put_ssm_parameter("/sandbox/monitoring/rw-password", new_pass, "SecureString", region=reg)
        if ok_user and ok_pass:
            print("[+] AWS SSM Parameter Store updated successfully.")
        else:
            print("[-] AWS SSM sync partial or skipped.")
    except Exception as e:
        print(f"[!] Warning: AWS SSM Parameter Store update failed: {e}")

    # 7. Phase 3: Grace Period (Wait for all spokes to switch)
    print(f"[*] Phase 3: Entering Grace Period ({GRACE_PERIOD}s) to allow spokes to migrate seamlessly...")
    time.sleep(GRACE_PERIOD)

    # 8. Phase 4: Revoke Deprecated Rotated Credentials from PrimaryHub
    print(f"[*] Phase 4: Revoking old rotated credentials while preserving system users...")
    latest_secret = json.loads(run_cmd(["kubectl", "-n", NAMESPACE, "get", "secret", "prometheus-web-config", "-o", "json"]))
    latest_raw = base64.b64decode(latest_secret["data"]["web.yml"]).decode("utf-8")

    current_map = {}
    for line in latest_raw.strip().split("\n"):
        line = line.strip()
        if ":" in line and not line.startswith("basic_auth_users"):
            parts = line.split(":", 1)
            u = parts[0].strip()
            h = parts[1].strip().strip('"').strip("'")
            current_map[u] = h

    pruned_users = {}
    for u, h in current_map.items():
        if u.startswith("prom-rw-"):
            if u == new_user:
                pruned_users[u] = h
            else:
                print(f"[-] Pruned deprecated rotating user: {u}")
        else:
            # Preserve system users (e.g. prometheus-rw, grafana)
            pruned_users[u] = h

    final_web_yml = "basic_auth_users:\n" + "\n".join([f'  {u}: "{h}"' for u, h in pruned_users.items()]) + "\n"
    final_patch = {
        "data": {
            "web.yml": base64.b64encode(final_web_yml.encode("utf-8")).decode("utf-8")
        }
    }
    run_cmd(["kubectl", "-n", NAMESPACE, "patch", "secret", "prometheus-web-config", "--type=merge", "-p", json.dumps(final_patch)])
    print("[+] Old rotating credentials removed from PrimaryHub secret. System users preserved.")

    time.sleep(5)
    # Trigger final hot-reload via SIGHUP
    run_cmd([
        "kubectl", "-n", NAMESPACE, "exec", "deploy/prometheus", "--",
        "kill", "-HUP", "1"
    ])
    print("=================================================================")
    print(f"  [SUCCESS] Secret Rotation Complete! Active rotating user: {new_user}")
    print(f"  Active user list: {list(pruned_users.keys())}")
    print("=================================================================")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prometheus-secret-rotator
  namespace: {{ .Values.namespace }}
  labels:
    app: prometheus
    component: secret-rotator
spec:
  schedule: {{ .Values.rotator.schedule | default "0 0 1 * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.rotator.successfulJobsHistoryLimit | default 3 }}
  failedJobsHistoryLimit: {{ .Values.rotator.failedJobsHistoryLimit | default 3 }}
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: prometheus-secret-rotator
        spec:
          serviceAccountName: prometheus-secret-rotator
          restartPolicy: OnFailure
          initContainers:
            - name: copy-kubectl
              image: {{ .Values.rotator.image.kubectl | default "docker.io/bitnami/kubectl:latest" | quote }}
              command: ["sh", "-c", "cp /opt/bitnami/kubectl/bin/kubectl /tools/kubectl && chmod 755 /tools/kubectl"]
              volumeMounts:
                - name: shared-tools
                  mountPath: /tools
          containers:
            - name: rotator
              image: {{ .Values.rotator.image.python | default "docker.io/library/python:3.11-alpine" | quote }}
              command: ["python3", "/scripts/rotate.py"]
              env:
                - name: NAMESPACE
                  value: {{ .Values.namespace | quote }}
                - name: GRACE_PERIOD_SECONDS
                  value: {{ .Values.rotator.gracePeriodSeconds | default 600 | quote }}
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: PATH
                  value: "/tools:/usr/local/bin:/usr/bin:/bin"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-ssm-credentials
                      key: AWS_ACCESS_KEY_ID
                      optional: true
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-ssm-credentials
                      key: AWS_SECRET_ACCESS_KEY
                      optional: true
                - name: AWS_SESSION_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: aws-ssm-credentials
                      key: AWS_SESSION_TOKEN
                      optional: true
                - name: AWS_REGION
                  value: "us-east-1"
              volumeMounts:
                - name: shared-tools
                  mountPath: /tools
                - name: script-volume
                  mountPath: /scripts
          volumes:
            - name: shared-tools
              emptyDir: {}
            - name: script-volume
              configMap:
                name: prometheus-rotator-script
                defaultMode: 0755
{{- end }}
