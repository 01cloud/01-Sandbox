{{- if and .Values.ingressRoute .Values.ingressRoute.enabled }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: grafana-private-policy
  namespace: {{ .Values.agentgatewayNamespace | default "agentgateway-system" }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana-route
  traffic:
    authorization:
      action: Deny
      policy:
        matchExpressions:
          - 'true{{- range $ip := .Values.global.allowedIps }} && !source.address.startsWith("{{ $ip }}"){{- end }}'
{{- end }}
