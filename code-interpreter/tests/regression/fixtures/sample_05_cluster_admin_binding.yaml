apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sample-05-cluster-admin-binding   # VULN: grants full cluster admin
subjects:
  - kind: ServiceAccount
    name: default                         # VULN: grants cluster-admin to default SA
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin                     # VULN: widest possible RBAC role
  apiGroup: rbac.authorization.k8s.io
