---
# =====================================================================
# Open Cluster Management (OCM) Prometheus Metrics Services & Config
# =====================================================================
# OCM Hub and Agent components use controller-runtime to expose standard
# Prometheus metrics on port 8080 at /metrics.
# This manifest creates dedicated ClusterIP services to ensure scrape targets
# are accessible via stable DNS and endpoints within the cluster.
# =====================================================================

# 1. OCM Hub Registration Controller Metrics Service
apiVersion: v1
kind: Service
metadata:
  name: ocm-registration-controller-metrics
  namespace: open-cluster-management-hub
  labels:
    app.kubernetes.io/name: ocm-registration-controller-metrics
    app.kubernetes.io/component: ocm-hub-controller
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: cluster-manager-registration-controller
  ports:
  - name: metrics
    port: 8080
    targetPort: 8080
    protocol: TCP
---
# 2. OCM Hub Work Controller Metrics Service
apiVersion: v1
