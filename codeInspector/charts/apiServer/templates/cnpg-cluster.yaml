{{- if and .Values.cnpg .Values.cnpg.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-primary-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  username: {{ .Values.cnpg.user | default "postgres" }}
  password: {{ .Values.cnpg.password | default "password123" }}
---
{{- if eq (.Values.cnpg.replication.role | default "primary") "primary" }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-primary
  namespace: {{ .Values.namespace }}
spec:
  instances: {{ .Values.cnpg.instances | default 1 }}
  imageName: {{ .Values.cnpg.imageName | default "ghcr.io/cloudnative-pg/postgresql:15.6" | quote }}
  primaryUpdateStrategy: unsupervised

  postgresql:
    parameters:
      max_connections: "200"
      wal_level: logical
      max_wal_senders: "10"
      wal_keep_size: "1GB"
    pg_hba:
      - host replication all all scram-sha-256
      - host replication all all md5
      - host all all all scram-sha-256
      - host all all all md5

  enableSuperuserAccess: true
  superuserSecret:
    name: postgresql-primary-credentials

  bootstrap:
    initdb:
      database: {{ .Values.cnpg.database | default "apikeys" }}
      owner: {{ .Values.cnpg.user | default "postgres" }}
      secret:
        name: postgresql-primary-credentials
      # Issue 1 fix: pre-create the 'app' role so CNPG reconciler can
      # execute ALTER ROLE "app" without hitting SQLSTATE 42704.
      # pg_basebackup clones this role to postgresql-secondary automatically.
      postInitSQL:
        - "CREATE ROLE app WITH LOGIN SUPERUSER PASSWORD '{{ .Values.cnpg.password | default "password123" }}';"

  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"
    labels:
      cnpg.io/cluster: postgresql-primary

  storage:
    size: {{ .Values.cnpg.storage | default "5Gi" }}
    storageClass: {{ .Values.cnpg.storageClassName | default "standard" }}
---
# Dedicated Prometheus metrics service for primary cluster
apiVersion: v1
kind: Service
metadata:
  name: postgresql-primary-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgresql-primary-metrics
    cnpg.io/cluster: postgresql-primary
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    cnpg.io/cluster: postgresql-primary
  ports:
  - port: 9187
    targetPort: 9187
    name: metrics
    protocol: TCP
---
# Expose primary replication service via NodePort directly in Kubernetes (replaces host-level socat)
apiVersion: v1
kind: Service
metadata:
  name: postgresql-replication
  namespace: {{ .Values.namespace }}
spec:
  type: NodePort
  selector:
    cnpg.io/cluster: postgresql-primary
    role: primary
  ports:
  - port: 5432
    targetPort: 5432
    nodePort: 30432
    name: postgresql
---
# Compatibility service alias for sandbox-api and other microservices
apiVersion: v1
kind: Service
metadata:
  name: postgresql-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    cnpg.io/cluster: postgresql-primary
    role: primary
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
{{- else }}
# Standby Replica Cluster on secondaryhub
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql-secondary
  namespace: {{ .Values.namespace }}
spec:
  instances: {{ .Values.cnpg.instances | default 1 }}
  imageName: {{ .Values.cnpg.imageName | default "ghcr.io/cloudnative-pg/postgresql:15.6" | quote }}

  postgresql:
    parameters:
      max_connections: "200"

  enableSuperuserAccess: true
  superuserSecret:
    name: postgresql-primary-credentials

  smartShutdownTimeout: 10
  stopDelay: 30

  replica:
    enabled: true
    source: postgresql-primary

  bootstrap:
    pg_basebackup:
      source: postgresql-primary

  externalClusters:
  - name: postgresql-primary
    connectionParameters:
      host: {{ .Values.cnpg.replication.primaryHost | quote }}
      port: {{ .Values.cnpg.replication.primaryPort | default 5432 | quote }}
      user: {{ .Values.cnpg.user | default "postgres" | quote }}
      dbname: {{ .Values.cnpg.database | default "apikeys" | quote }}
      sslmode: prefer
    password:
      name: postgresql-primary-credentials
      key: password

  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"
    labels:
      cnpg.io/cluster: postgresql-secondary

  storage:
    size: {{ .Values.cnpg.storage | default "5Gi" }}
    storageClass: {{ .Values.cnpg.storageClassName | default "standard" }}
---
# Dedicated Prometheus metrics service for secondary cluster
apiVersion: v1
kind: Service
metadata:
  name: postgresql-secondary-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgresql-secondary-metrics
    cnpg.io/cluster: postgresql-secondary
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    cnpg.io/cluster: postgresql-secondary
  ports:
  - port: 9187
    targetPort: 9187
    name: metrics
    protocol: TCP
---
# Compatibility service alias on secondaryhub
apiVersion: v1
kind: Service
metadata:
  name: postgresql-service
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    cnpg.io/cluster: postgresql-secondary
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
{{- end }}
{{- end }}
