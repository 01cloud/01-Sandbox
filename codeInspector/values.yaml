################################################################
# This chart aggregates values from all sub-chart
################################################################

global:
  apiRoutePrefix: "/api/v1/01sbx"
  JWT_PUBLIC_JWKS: ""
  allowedIps:
    - "110.44.123.206"
    - "10."
    - "127.0.0.1"
    - "::1"
################################################################
# Agent Gateway  values
################################################################
agentgateway:
  enabled: true
  namespace: agentgateway-system
  httproute:
    hostnames:
      - api-sandbox.01security.com
      - 10.0.10.9
    backendService:
      name: sandbox-api-service
      port: 80
  gateway:
    gatewayClassName: agentgateway
    addresses:
      - value: 10.0.10.9
    listeners:
      - protocol: HTTP
        port: 80
        name: http
      - protocol: HTTPS
        port: 443
        name: https
        tls:
          certificateRefs:
            - name: agentgateway-tls
      - protocol: TCP
        port: 5432
        name: postgresql
      - protocol: TCP
        port: 6379
        name: redis
      - protocol: TCP
        port: 5672
        name: rabbitmq-amqp
  policy:
    authenticationType: "jwt"
    jwtMode: "Strict"
    rateLimit:
      enabled: false
      requests: 7
      unit: "Minutes"
################################################################
# Agent Gateway Controller values
################################################################
agentgateway-controller:
  enabled: true
  controller:
    extraEnv:
      KGW_ENABLE_GATEWAY_API_EXPERIMENTAL_FEATURES: "true"
    image:
      pullPolicy: Always
################################################################
# API Server component values
################################################################
apiServer:
  enabled: true
  namespace: opensandbox-system
  configMap:
    PYTHONUNBUFFERED: "1"
    APP_ENV: "production"
    PORT: "8000"
    BACKEND_URL_OPENSANDBOX: "http://opensandbox-server.opensandbox-system.svc.cluster.local"
    RATE_LIMIT_REQUESTS: "20"
    RATE_LIMIT_WINDOW_SECS: "60"
    GATEWAY_SECRET_NAME: "apikey"
    GATEWAY_SECRET_NAMESPACE: "agentgateway-system"
    GATEWAY_SECRET_KEY: "api-key"
    JWT_EXPIRATION_MINUTES: "60"
    JWT_ISSUER: "01 Sandbox"
    JWT_ALGORITHM: "RS256"
    AUTH0_DOMAIN: "dev-1u502t8piuwyzb28.us.auth0.com"
    AUTH0_AUDIENCE: "https://api-sandbox"
    OPENSANDBOX_ROUTE_PREFIX: "{{ .Values.global.apiRoutePrefix }}"
    DASHBOARD_BACKENDS_JSON: '[{"id":"Z1_SANDBOX","name":"01 Sandbox","description":"Production-grade hardened cluster for secure code execution.","icon":"terminal","color":"indigo","baseUrl":"https://api-sandbox.01security.com{{ .Values.global.apiRoutePrefix }}","documentationUrl":"https://api-sandbox.01security.com{{ .Values.global.apiRoutePrefix }}/docs"}]'
    JWT_PUBLIC_JWKS: ""
    SENDGRID_FROM_EMAIL: "sandbox@01security.com"
  secret:
    E2B_API_KEY: ""
    JWT_PRIVATE_KEY: ""
    JWT_PUBLIC_JWKS: ""
    SENDGRID_API_KEY: ""
  sealedSecrets:
    enabled: true
    encryptedData:
      E2B_API_KEY: ""
      JWT_PRIVATE_KEY: ""
      JWT_PUBLIC_JWKS: ""
      SENDGRID_API_KEY: ""
      PG_PASSWORD: ""
      REDIS_PASSWORD: ""
      RABBITMQ_PASSWORD: ""
  deployment:
    replicaCount: 1
    image:
      repository: 01community/01sandbox-api
      tag: "v0.5.113"
      pullPolicy: Always
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "256Mi"
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 1000
  service:
    type: NodePort
    port: 80
    targetPort: 8000
    nodePort: 30080
  ingress:
    enabled: false
    className: nginx
    host: api-sandbox.01security.com
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
      nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  postgresql:
    enabled: true
    host: "postgresql-service"
    port: 5432
    user: "postgres"
    password: "password123"
    database: "apikeys"
    storage: "5Gi"
    storageClassName: "longhorn"
  redis:
    enabled: true
    host: "redis-service"
    port: 6379
    password: ""
  rabbitmq:
    enabled: true
    host: "rabbitmq-service"
    port: 5672
    user: "admin"
    password: "changeme"
    maxQuickScanWorkers: "2"
    maxRepoScanWorkers: "5"
################################################################
# MetalLB component values
################################################################
metallb:
  enabled: true
  namespace: metallb-system
  ipAddressPool:
    addresses:
      # - 172.18.0.200-172.18.0.250
      - 10.0.10.9-10.0.10.9
  l2Advertisement:
    enabled: true
################################################################
# Kind Cluster component values
################################################################
kindCluster:
  enabled: false
  namespace: kind-cluster
  runtimeClass:
    name: gvisor
    handler: runsc
################################################################
# OpenSandbox component values
################################################################
opensandbox:
  enabled: true
  namespace: opensandbox-system
  controller:
    replicaCount: 1
    image:
      repository: 01community/01sandbox-opensandbox-controller
      tag: "0.5.1"
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  server:
    replicaCount: 1
    sandboxImage: "01community/01sandbox-codeinterpreter:v0.5.24"
    sandboxCpu: "1000m"
    sandboxMemory: "1024Mi"
    image:
      repository: 01community/01sandbox-opensandbox-server
      tag: "v0.5.111"
      pullPolicy: Always
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storage:
      enabled: true
      pvcName: "scan-pvc"
      size: "10Gi"
      accessMode: "ReadWriteMany"
      mountPath: "/data"
      storageClassName: "longhorn"
################################################################
# OpenSandbox Resource Pool component values
################################################################
opensandboxResourcePool:
  enabled: false
  namespace: opensandbox-system
  pool:
    name: my-sandbox-pool
    container:
      image: "01community/01sandbox-codeinterpreter:0.0.23"
      ports:
        - containerPort: 44772
        - containerPort: 54321
    capacitySpec:
      bufferMin: 3
      bufferMax: 10
      poolMin: 1
      poolMax: 50
###############################################################
# Prometheus component values
###############################################################
prometheus:
  enabled: false
  namespace: monitoring
  apiServerNamespace: opensandbox-system
  apiServerServiceName: sandbox-api-service
  apiServerPort: 80
  agentgatewayNamespace: agentgateway-system
  agentgatewayServiceName: agentgateway-proxy
  agentgatewayPort: 80
  replicaCount: 1
  ingressRoute:
    enabled: true
  ingressHostnames:
    - api-sandbox.01security.com
    - 10.0.10.9
  ingressPath: "/prometheus"
  image:
    repository: prom/prometheus
    tag: "v2.54.1"
    pullPolicy: IfNotPresent
  persistence:
    enabled: false
    pvcName: "prometheus-pvc"
  service:
    type: ClusterIP
    port: 9090
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
###############################################################
# Grafana component values
###############################################################
grafana:
  enabled: false
  namespace: monitoring
  prometheusNamespace: monitoring
  prometheusServiceName: prometheus-service
  prometheusPort: 9090
  replicaCount: 1
  ingressRoute:
    enabled: true
  ingressHost: "api-sandbox.01security.com"
  ingressHostnames:
    - api-sandbox.01security.com
    - 10.0.10.9
  ingressPath: "/grafana"
  image:
    repository: grafana/grafana
    tag: "11.1.0"
    pullPolicy: IfNotPresent
  persistence:
    enabled: false
    pvcName: "grafana-pvc"
  service:
    type: NodePort
    port: 3000
    nodePort: 32000
  adminPassword: "admin"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
###############################################################
# Sealed Secrets subchart controller values
###############################################################
sealed-secrets:
  enabled: true
