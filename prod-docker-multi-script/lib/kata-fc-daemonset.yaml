apiVersion: v1
kind: ServiceAccount
metadata:
  name: kata-fc-reconciler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kata-fc-reconciler
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["node.k8s.io"]
  resources: ["runtimeclasses"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kata-fc-reconciler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kata-fc-reconciler
subjects:
- kind: ServiceAccount
  name: kata-fc-reconciler
  namespace: kube-system
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-fc
handler: kata-fc
---
apiVersion: v1
kind: Namespace
metadata:
  name: opensandbox-workloads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: klusterlet-work-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: klusterlet-work-sa
  namespace: open-cluster-management-agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kata-fc-reconciler-script
  namespace: kube-system
data:
  reconcile.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    echo "=================================================="
    echo "  Kata Firecracker Kubernetes Node Reconciler"
    echo "  Node: ${NODE_NAME:-unknown}"
    echo "=================================================="

    run_host_bash() {
      NODE_NAME="${NODE_NAME:-}" nsenter -t 1 -m -u -i -n -p -- /bin/bash -s
    }

    reconcile_node() {
      local node="${NODE_NAME:-}"
      local spoke=$(echo "$node" | sed 's/-control-plane$//')

      echo "[RECONCILE] Checking node environment on ${node} (spoke: ${spoke})..."

      run_host_bash << 'HOST_EOF'
    set -e
    node="${NODE_NAME:-}"
    [ -z "$node" ] && node=$(hostname)
    spoke=$(echo "$node" | sed 's/-control-plane$//')
    vg="containerd-vg-${spoke}"
    pool_name="containerd--vg--${spoke}-containerd--pool"

    # 1. Ensure LVM & thin provisioning tools exist on node
    if ! which vgs >/dev/null 2>&1 || ! which thin_check >/dev/null 2>&1; then
      echo "[RECONCILE] Installing lvm2 and thin-provisioning-tools on host node..."
      rm -f /var/lib/dpkg/lock* /var/lib/apt/lists/lock /var/cache/apt/archives/lock 2>/dev/null || true
      dpkg --configure -a 2>/dev/null || true
      dpkg --purge linux-image-rt-amd64 2>/dev/null || true
      apt-get update -qq && apt-get install -y -qq lvm2 thin-provisioning-tools >/dev/null 2>&1 || true
    fi

    # 1b. Ensure containerd has devmapper snapshotter support
    if ! ctr plugins ls 2>/dev/null | grep -q 'snapshotter.v1.*devmapper'; then
      echo "[RECONCILE] Ensuring devmapper support in containerd..."
      if [ -f /usr/bin/containerd ] && /usr/bin/containerd --version >/dev/null 2>&1; then
        cp /usr/bin/containerd /usr/local/bin/containerd 2>/dev/null || true
      elif which apt-get >/dev/null 2>&1; then
        rm -f /var/lib/dpkg/lock* /var/lib/apt/lists/lock /var/cache/apt/archives/lock 2>/dev/null || true
        dpkg --configure -a 2>/dev/null || true
        apt-get update -qq && apt-get install -y -qq containerd >/dev/null 2>&1 || true
        [ -f /usr/bin/containerd ] && cp /usr/bin/containerd /usr/local/bin/containerd 2>/dev/null || true
      fi
    fi

    # 2. Configure LVM inside node to disable udev_sync & monitoring
    if [ -f /etc/lvm/lvm.conf ]; then
      sed -i 's/udev_sync = 1/udev_sync = 0/' /etc/lvm/lvm.conf 2>/dev/null || true
      sed -i 's/udev_rules = 1/udev_rules = 0/' /etc/lvm/lvm.conf 2>/dev/null || true
      if ! grep -q 'udev_sync = 0' /etc/lvm/lvm.conf 2>/dev/null; then
        echo 'activation { udev_sync = 0 udev_rules = 0 monitoring = 0 }' >> /etc/lvm/lvm.conf
      fi
    fi
    mkdir -p /opt/kata/bin /opt/kata/share/kata-containers /etc/kata-containers /var/lib/containerd/io.containerd.snapshotter.v1.devmapper

    # 3. Ensure Kata Containers static release and Firecracker exist on node
    KATA_VER="3.18.0"
    FC_VER="v1.11.1"
    if [ ! -s /opt/kata/bin/containerd-shim-kata-v2 ] || [ ! -s /opt/kata/share/kata-containers/vmlinux.container ]; then
      echo "[RECONCILE] Downloading Kata Containers static release v${KATA_VER}..."
      which xz >/dev/null 2>&1 || apt-get install -y -qq xz-utils curl >/dev/null 2>&1 || true
      mkdir -p /tmp/kata-dl /opt/kata
      curl -fSL "https://github.com/kata-containers/kata-containers/releases/download/${KATA_VER}/kata-static-${KATA_VER}-amd64.tar.xz" -o /tmp/kata-dl/kata.tar.xz 2>/dev/null || true
      if [ -s /tmp/kata-dl/kata.tar.xz ]; then
        tar -xJf /tmp/kata-dl/kata.tar.xz -C /tmp/kata-dl 2>/dev/null || true
        cp -r /tmp/kata-dl/opt/kata/* /opt/kata/ 2>/dev/null || true
        rm -rf /tmp/kata-dl
      fi
    fi

    if [ ! -s /opt/kata/bin/firecracker ]; then
      echo "[RECONCILE] Downloading Firecracker ${FC_VER}..."
      mkdir -p /tmp/fc-dl /opt/kata/bin
      curl -fSL "https://github.com/firecracker-microvm/firecracker/releases/download/${FC_VER}/firecracker-${FC_VER}-x86_64.tgz" -o /tmp/fc-dl/fc.tgz 2>/dev/null || true
      if [ -s /tmp/fc-dl/fc.tgz ]; then
        tar -xzf /tmp/fc-dl/fc.tgz -C /tmp/fc-dl 2>/dev/null || true
        cp "/tmp/fc-dl/release-${FC_VER}-x86_64/firecracker-${FC_VER}-x86_64" /opt/kata/bin/firecracker 2>/dev/null || true
        cp "/tmp/fc-dl/release-${FC_VER}-x86_64/jailer-${FC_VER}-x86_64" /opt/kata/bin/jailer 2>/dev/null || true
        chmod +x /opt/kata/bin/firecracker /opt/kata/bin/jailer 2>/dev/null || true
        rm -rf /tmp/fc-dl
      fi
    fi

    # 4. Ensure Kata configuration and symlinks
    mkdir -p /etc/kata-containers
    if [ ! -s /etc/kata-containers/configuration.toml ]; then
      if [ -s /opt/kata/share/defaults/kata-containers/configuration-fc.toml ]; then
        cp /opt/kata/share/defaults/kata-containers/configuration-fc.toml /etc/kata-containers/configuration.toml
      elif [ -s /opt/kata/share/defaults/kata-containers/configuration.toml ]; then
        cp /opt/kata/share/defaults/kata-containers/configuration.toml /etc/kata-containers/configuration.toml
      fi
      sed -i 's|^path = .*|path = "/usr/local/bin/firecracker"|g' /etc/kata-containers/configuration.toml 2>/dev/null || true
      sed -i 's|^jailer_path = .*|jailer_path = "/usr/local/bin/jailer"|g' /etc/kata-containers/configuration.toml 2>/dev/null || true
    fi

    [ -s /opt/kata/bin/containerd-shim-kata-v2 ] && ln -sf /opt/kata/bin/containerd-shim-kata-v2 /usr/local/bin/containerd-shim-kata-v2
    [ -s /opt/kata/bin/firecracker ] && ln -sf /opt/kata/bin/firecracker /usr/local/bin/firecracker
    [ -s /opt/kata/bin/jailer ] && ln -sf /opt/kata/bin/jailer /usr/local/bin/jailer 2>/dev/null || true
    [ -s /opt/kata/bin/kata-runtime ] && ln -sf /opt/kata/bin/kata-runtime /usr/local/bin/kata-runtime 2>/dev/null || true
    [ -s /opt/kata/bin/kata-ctl ] && ln -sf /opt/kata/bin/kata-ctl /usr/local/bin/kata-ctl 2>/dev/null || true

    # 5. Install robust dmsetup wrapper
    if [ ! -f /usr/sbin/dmsetup.orig ] && [ -f /usr/sbin/dmsetup ]; then
      mv /usr/sbin/dmsetup /usr/sbin/dmsetup.orig
      cat << 'WRAPPER_EOF' > /usr/sbin/dmsetup
    #!/bin/sh
    /usr/sbin/dmsetup.orig "$@"
    ret=$?
    if [ $ret -eq 0 ]; then
      /usr/sbin/dmsetup.orig mknodes >/dev/null 2>&1 || true
      /usr/sbin/dmsetup.orig ls 2>/dev/null | while read -r name majmin; do
        maj=$(echo "$majmin" | tr -d '()' | cut -d: -f1)
        min=$(echo "$majmin" | tr -d '()' | cut -d: -f2)
        if [ -n "$maj" ] && [ -n "$min" ]; then
          [ ! -e "/dev/dm-${min}" ] && mknod "/dev/dm-${min}" b "$maj" "$min" 2>/dev/null || true
          [ ! -e "/dev/mapper/${name}" ] && ln -sf "/dev/dm-${min}" "/dev/mapper/${name}" 2>/dev/null || true
        fi
      done
    fi
    exit $ret
    WRAPPER_EOF
      chmod +x /usr/sbin/dmsetup
    fi

    # 6. Provision loop device and LVM thin pool
    IMG="/var/lib/containerd-pool-disk-${spoke}.img"
    [ ! -f "$IMG" ] && truncate -s 15G "$IMG"

    bname=$(basename "$IMG")
    existing=$(losetup -a 2>/dev/null | grep -F "$bname" | cut -d: -f1 || true)
    primary=$(echo "$existing" | head -n1)

    if [ -n "$primary" ]; then
      echo "$existing" | tail -n +2 | while read -r dup; do
        [ -n "$dup" ] && losetup -d "$dup" 2>/dev/null || true
      done
    else
      primary=$(losetup -fP --show "$IMG" 2>/dev/null || true)
    fi

    if ! vgs --config 'activation { udev_sync = 0 udev_rules = 0 monitoring = 0 }' "${vg}" >/dev/null 2>&1; then
      pvcreate -y "$primary" >/dev/null 2>&1 || true
      vgcreate -y "${vg}" "$primary" >/dev/null 2>&1 || true
      lvcreate -y --config 'activation { udev_sync = 0 udev_rules = 0 monitoring = 0 }' -W n -Z n --size 12G --thinpool containerd-pool "${vg}" >/dev/null 2>&1 || true
    fi

    vgchange -ay --config 'activation { udev_sync = 0 udev_rules = 0 monitoring = 0 }' -K "${vg}" >/dev/null 2>&1 || true

    mkdir -p /dev/mapper
    DMSETUP="/usr/sbin/dmsetup.orig"
    [ ! -x "$DMSETUP" ] && DMSETUP="/usr/sbin/dmsetup"
    if [ -x "$DMSETUP" ]; then
      $DMSETUP mknodes 2>/dev/null || true

      # Prune orphaned dm thin snapshot devices that have open count == 0 and are not mounted
      $DMSETUP ls 2>/dev/null | awk '{print $1}' | grep -E '^containerd--vg-.*-pool-snap-[0-9]+' | while read -r dname; do
        oc=$([ -x "$DMSETUP" ] && "$DMSETUP" info -c --noheadings -o open "$dname" 2>/dev/null | tr -d ' ' || echo "1")
        if [ "$oc" = "0" ]; then
          if ! grep -q "$dname" /proc/mounts 2>/dev/null; then
            "$DMSETUP" remove "$dname" 2>/dev/null || true
            rm -f "/dev/mapper/${dname}" 2>/dev/null || true
          fi
        fi
      done

      $DMSETUP ls 2>/dev/null | while read -r name majmin; do
        maj=$(echo "$majmin" | tr -d '()' | cut -d: -f1)
        min=$(echo "$majmin" | tr -d '()' | cut -d: -f2)
        if [ -n "$maj" ] && [ -n "$min" ]; then
          [ ! -e "/dev/dm-${min}" ] && mknod "/dev/dm-${min}" b "$maj" "$min" 2>/dev/null || true
          [ ! -e "/dev/mapper/${name}" ] && ln -sf "/dev/dm-${min}" "/dev/mapper/${name}" 2>/dev/null || true
        fi
      done
    fi

    # 7. Install node boot persistence script and systemd drop-in
    cat << 'SCRIPTEOF' > /usr/local/bin/init-containerd-devmapper.sh
    #!/bin/bash
    set -e
    if [ -f /etc/lvm/lvm.conf ] && ! grep -q 'udev_sync = 0' /etc/lvm/lvm.conf 2>/dev/null; then
      echo 'activation { udev_sync = 0 udev_rules = 0 monitoring = 0 }' >> /etc/lvm/lvm.conf
    fi
    for img in /var/lib/containerd-pool-disk-*.img; do
      [ -f "$img" ] || continue
      bname=$(basename "$img")
      existing=$(losetup -a 2>/dev/null | grep -F "$bname" | cut -d: -f1 || true)
      primary=$(echo "$existing" | head -n1)
      if [ -n "$primary" ]; then
        echo "$existing" | tail -n +2 | while read -r dup; do
          [ -n "$dup" ] && losetup -d "$dup" 2>/dev/null || true
        done
      else
        losetup -fP "$img" 2>/dev/null || true
      fi
    done
    vgscan --config 'activation { udev_sync = 0 udev_rules = 0 monitoring = 0 }' 2>/dev/null || true
    VGS=$(vgs --config 'activation { udev_sync = 0 udev_rules = 0 monitoring = 0 }' --noheadings -o vg_name 2>/dev/null | tr -d ' ' | grep '^containerd-vg' || true)
    for v in $VGS; do
      vgchange -ay --config 'activation { udev_sync = 0 udev_rules = 0 monitoring = 0 }' -K "$v" 2>/dev/null || true
    done
    mkdir -p /dev/mapper
    DMSETUP="/usr/sbin/dmsetup.orig"
    [ ! -x "$DMSETUP" ] && DMSETUP="/usr/sbin/dmsetup"
    [ -x "$DMSETUP" ] && $DMSETUP mknodes 2>/dev/null || true
    exit 0
    SCRIPTEOF
    chmod +x /usr/local/bin/init-containerd-devmapper.sh 2>/dev/null || true

    cat << 'UNITEOF' > /etc/systemd/system/containerd-devmapper.service
    [Unit]
    Description=Ensure Loop Devices and LVM Thin Pool for Containerd Devmapper
    DefaultDependencies=no
    Before=containerd.service
    After=local-fs.target

    [Service]
    Type=oneshot
    ExecStart=/usr/local/bin/init-containerd-devmapper.sh
    RemainAfterExit=yes

    [Install]
    WantedBy=multi-user.target containerd.service
    UNITEOF

    mkdir -p /etc/systemd/system/containerd.service.d
    cat << 'DROPINEOF' > /etc/systemd/system/containerd.service.d/10-devmapper.conf
    [Unit]
    Requires=containerd-devmapper.service
    After=containerd-devmapper.service

    [Service]
    ExecStartPre=/usr/local/bin/init-containerd-devmapper.sh
    DROPINEOF

    systemctl daemon-reload 2>/dev/null || true
    systemctl enable containerd-devmapper.service 2>/dev/null || true

    # 8. Configure containerd config.toml for kata-fc and devmapper
    changed=0
    sed -i 's/discard_unpacked_layers = true/discard_unpacked_layers = false/' /etc/containerd/config.toml 2>/dev/null || true

    if ! grep -q 'use_local_image_pull' /etc/containerd/config.toml 2>/dev/null; then
      printf '
    [plugins."io.containerd.cri.v1.images"]
      use_local_image_pull = true
    ' >> /etc/containerd/config.toml
      changed=1
    fi

    if ! grep -q 'plugins."io.containerd.grpc.v1.cri".containerd.runtimes.kata-fc' /etc/containerd/config.toml 2>/dev/null; then
      printf '
    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.kata-fc]
      runtime_type = "io.containerd.kata.v2"
      snapshotter = "devmapper"

    [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.kata-fc.options]
      ConfigPath = "/etc/kata-containers/configuration.toml"

    [plugins."io.containerd.snapshotter.v1.devmapper"]
      root_path = "/var/lib/containerd/io.containerd.snapshotter.v1.devmapper"
      pool_name = "'"$pool_name"'"
      base_image_size = "4GB"
      discard_blocks = false
      fs_type = "ext4"
    ' >> /etc/containerd/config.toml
      changed=1
    else
      sed -i 's/pool_name = .*/pool_name = "'"$pool_name"'"/' /etc/containerd/config.toml 2>/dev/null || true
      sed -i 's/discard_blocks = true/discard_blocks = false/' /etc/containerd/config.toml 2>/dev/null || true
    fi

    if ! ctr plugins ls 2>/dev/null | grep -E 'devmapper\s+linux/amd64\s+ok' >/dev/null 2>&1; then
      changed=1
    fi

    if [ "$changed" -eq 1 ]; then
      systemctl restart containerd 2>/dev/null || true
    fi
    HOST_EOF

      # 9. Wait and verify devmapper status
      for i in $(seq 1 15); do
        if nsenter -t 1 -m -u -i -n -p -- ctr plugins ls 2>/dev/null | grep -E 'devmapper\s+linux/amd64\s+ok' >/dev/null 2>&1; then
          echo "[RECONCILE] Kata Firecracker + devmapper is HEALTHY on ${node}!"
          return 0
        fi
        sleep 2
      done

      echo "[WARN] Devmapper plugin not yet ok; will retry on next reconcile loop."
      return 1
    }

    # Main Controller Loop
    reconcile_node || true

    while true; do
      sleep 10
      spoke=$(echo "${NODE_NAME:-}" | sed 's/-control-plane$//')
      pool_dev="/dev/mapper/containerd--vg--${spoke}-containerd--pool"

      # Prune orphaned snapshot devices with open count 0
      nsenter -t 1 -m -u -i -n -p -- bash -c '
        DMSETUP="/usr/sbin/dmsetup.orig"; [ ! -x "$DMSETUP" ] && DMSETUP="/usr/sbin/dmsetup"
        if [ -x "$DMSETUP" ]; then
          $DMSETUP ls 2>/dev/null | awk "{print \$1}" | grep -E "^containerd--vg-.*-pool-snap-[0-9]+" | while read -r dname; do
            oc=$($DMSETUP info -c --noheadings -o open "$dname" 2>/dev/null | tr -d " " || echo "1")
            if [ "$oc" = "0" ] && ! grep -q "$dname" /proc/mounts 2>/dev/null; then
              $DMSETUP remove "$dname" 2>/dev/null || true
              rm -f "/dev/mapper/${dname}" 2>/dev/null || true
            fi
          done
        fi
      ' 2>/dev/null || true

      if ! nsenter -t 1 -m -u -i -n -p -- ctr plugins ls 2>/dev/null | grep -E 'devmapper\s+linux/amd64\s+ok' >/dev/null 2>&1 ||      ! nsenter -t 1 -m -u -i -n -p -- test -b "$pool_dev" 2>/dev/null ||      ! nsenter -t 1 -m -u -i -n -p -- lvs -o lv_attr --noheadings "containerd-vg-${spoke}/containerd-pool" 2>/dev/null | grep -q 'twi-a'; then
        echo "[HEAL] Node ${NODE_NAME:-} Kata devmapper degraded! Self-healing..."
        reconcile_node || true
      fi
    done
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kata-fc-node-reconciler
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kata-fc-node-reconciler
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kata-fc-node-reconciler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kata-fc-node-reconciler
    spec:
      serviceAccountName: kata-fc-reconciler
      hostPID: true
      hostNetwork: true
      tolerations:
      - operator: Exists
      containers:
      - name: reconciler
        image: debian:bookworm-slim
        command: [/bin/bash, /scripts/reconcile.sh]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
        volumeMounts:
        - name: script
          mountPath: /scripts
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
      volumes:
      - name: script
        configMap:
          name: kata-fc-reconciler-script
          defaultMode: 0755
