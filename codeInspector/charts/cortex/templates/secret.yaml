{{- $ca := genCA "cortex-ca" 730 -}}
{{- $cert := genSignedCert "cortex.sandbox.internal" (list "127.0.0.1" "10.99.0.50") (list "localhost" "cortex" "cortex.opensandbox-system" "cortex.opensandbox-system.svc" "cortex.opensandbox-system.svc.cluster.local") 730 $ca -}}
apiVersion: v1
kind: Secret
metadata:
  name: cortex-tls-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: cortex
    tier: monitoring
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cortex-auth-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: cortex
    tier: monitoring
type: Opaque
stringData:
  .htpasswd: |
    {{ htpasswd .Values.auth.writerUsername .Values.auth.writerPassword }}
    {{ htpasswd .Values.auth.readerUsername .Values.auth.readerPassword }}
  writer-password: {{ .Values.auth.writerPassword | quote }}
  reader-password: {{ .Values.auth.readerPassword | quote }}
