apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-04-no-resource-limits
spec:
  replicas: 100       # VULN: excessive replicas with no limits
  selector:
    matchLabels:
      app: no-limits
  template:
    metadata:
      labels:
        app: no-limits
    spec:
      containers:
        - name: app
          image: myapp:latest
          # VULN: no resources.requests or resources.limits defined
          # This allows the container to consume unbounded CPU/memory
          # and evict other workloads (resource exhaustion)
