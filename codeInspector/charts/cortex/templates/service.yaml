apiVersion: v1
kind: Service
metadata:
  name: cortex
  namespace: {{ .Release.Namespace }}
  labels:
    app: cortex
    tier: monitoring
spec:
  type: NodePort
  ports:
    - name: https-gate
      port: {{ .Values.nginx.port }}
      targetPort: {{ .Values.nginx.port }}
      nodePort: {{ .Values.nginx.nodePort }}
      protocol: TCP
  selector:
    app: cortex
