{{- if and .Values.ingressRoute .Values.ingressRoute.enabled }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: prometheus-private-policy
  namespace: {{ .Values.agentgatewayNamespace | default "agentgateway-system" }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prometheus-route
  traffic:
    authorization:
      action: Deny
      policy:
        matchExpressions:
          - '!source.address.startsWith("10.") && !source.address.startsWith("192.168.") && !source.address.startsWith("172.") && !source.address.startsWith("127.") && !source.address.startsWith("::1")'
{{- end }}
