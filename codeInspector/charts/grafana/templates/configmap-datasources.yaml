apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: {{ .Values.namespace }}
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      {{- if .Values.datasources }}
      {{- toYaml .Values.datasources | nindent 6 }}
      {{- else }}
      # ── Local: primaryhub (Central TSDB for All Fleet Metrics) ───────────────
      - name: "primaryhub"
        uid: "prometheus-primaryhub"
        type: prometheus
        access: proxy
        url: http://{{ .Values.prometheusServiceName }}.{{ .Values.prometheusNamespace }}.svc.cluster.local:{{ .Values.prometheusPort }}
        isDefault: true
        jsonData:
          timeInterval: "15s"
          httpMethod: GET
        {{- if and .Values.prometheusAuth .Values.prometheusAuth.enabled }}
        basicAuth: true
        basicAuthUser: {{ .Values.prometheusAuth.username | quote }}
        secureJsonData:
          basicAuthPassword: {{ .Values.prometheusAuth.password | quote }}
        {{- end }}
        editable: false

      # ── Remote: secondaryhub (Central Ingestion via Push) ─────────────────────
      - name: "secondaryhub"
        uid: "prometheus-secondaryhub"
        type: prometheus
        url: http://{{ .Values.prometheusServiceName }}.{{ .Values.prometheusNamespace }}.svc.cluster.local:{{ .Values.prometheusPort }}
        access: proxy
        isDefault: false
        jsonData:
          timeInterval: "15s"
          httpMethod: GET
        {{- if and .Values.prometheusAuth .Values.prometheusAuth.enabled }}
        basicAuth: true
        basicAuthUser: {{ .Values.prometheusAuth.username | quote }}
        secureJsonData:
          basicAuthPassword: {{ .Values.prometheusAuth.password | quote }}
        {{- end }}
        editable: false

      # ── Long-Term: Cortex AWS S3 TSDB (Historical Metrics) ──────────────────
      - name: "cortex-s3-longterm"
        uid: "cortex-s3-longterm"
        type: prometheus
        access: proxy
        url: "https://10.99.0.50:8443/prometheus"
        isDefault: false
        basicAuth: true
        basicAuthUser: "grafana-reader"
        secureJsonData:
          basicAuthPassword: "GrafanaReaderSecret2026!"
        jsonData:
          tlsSkipVerify: true
          timeInterval: "15s"
          httpMethod: POST
        editable: false
      {{- end }}
