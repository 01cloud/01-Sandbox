apiVersion: v1
kind: Pod
metadata:
  name: sample-08-sensitive-hostpath
spec:
  containers:
    - name: system-read
      image: alpine:latest
      volumeMounts:
        - name: etc-root
          mountPath: /host-etc
        - name: var-log
          mountPath: /host-log
        - name: user-home
          mountPath: /host-home
  volumes:
    - name: etc-root
      hostPath:
        path: /etc             # VULN: sensitive configuration files exposed
    - name: var-log
      hostPath:
        path: /var/log         # VULN: logs including system access logs exposed
    - name: user-home
      hostPath:
        path: /home            # VULN: user directory configuration exposed
