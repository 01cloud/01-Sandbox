      image: myapp:latest
      env:
        - name: DB_PASSWORD
          value: "P@ssw0rd123!"              # VULN: hardcoded secret in env var
        - name: AWS_ACCESS_KEY_ID
          value: "AKIAIOSFODNN7EXAMPLE"      # VULN: hardcoded AWS key
