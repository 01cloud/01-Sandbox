apiVersion: v1
kind: ConfigMap
metadata:
  name: cortex-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: cortex
    tier: monitoring
data:
  cortex.yaml: |
    target: all
    auth_enabled: {{ .Values.auth.enabled }}

    server:
      http_listen_address: 0.0.0.0
      http_listen_port: 9009
      grpc_listen_address: 0.0.0.0
      grpc_listen_port: 9095
      log_level: info

{{- with .Values.limits }}
    limits:
      reject_old_samples: {{ .rejectOldSamples }}
      reject_old_samples_max_age: {{ .rejectOldSamplesMaxAge }}
      creation_grace_period: {{ .creationGracePeriod }}
      max_label_names_per_series: {{ int .maxLabelNamesPerSeries }}
      max_label_name_length: {{ int .maxLabelNameLength }}
      max_label_value_length: {{ int .maxLabelValueLength }}
      ingestion_rate: {{ int .ingestionRate }}
      ingestion_burst_size: {{ int .ingestionBurstSize }}
      max_series_per_user: {{ int .maxSeriesPerUser }}
{{- end }}

    distributor:
      ring:
        kvstore:
          store: memberlist

    ingester:
      lifecycler:
        ring:
          kvstore:
            store: memberlist
          replication_factor: 1
        final_sleep: 0s

    memberlist:
      bind_addr: ["127.0.0.1"]
      bind_port: 7946

    blocks_storage:
      backend: s3
      s3:
        bucket_name: {{ .Values.s3.bucket }}
        endpoint: {{ .Values.s3.endpoint }}
        region: {{ .Values.s3.region }}
        insecure: {{ .Values.s3.insecure }}
      tsdb:
        dir: /var/lib/cortex/tsdb
        block_ranges_period: [2h]
        retention_period: 6h
        ship_concurrency: 4

    store_gateway:
      sharding_ring:
        replication_factor: 1
        kvstore:
          store: memberlist

    compactor:
      data_dir: /var/lib/cortex/compactor
      compaction_interval: 10m

  nginx.conf: |
    events {
        worker_connections 1024;
    }

    http {
        map $remote_user $is_authorized {
            default              0;
            "~^cortex-writer"    1;
            "~^grafana-reader"   2;
        }

        server {
            listen {{ .Values.nginx.port }} ssl;
            http2 on;
            server_name _;

            ssl_certificate           /etc/nginx/certs/tls.crt;
            ssl_certificate_key       /etc/nginx/certs/tls.key;
            ssl_protocols             TLSv1.2 TLSv1.3;
            ssl_ciphers               ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
            ssl_prefer_server_ciphers on;

            auth_basic           "01-Sandbox Cortex Long-Term Storage Gate";
            auth_basic_user_file /etc/nginx/auth/.htpasswd;

            proxy_set_header X-Scope-OrgID "{{ .Values.auth.orgId }}";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            location /api/v1/push {
                if ($is_authorized != 1) {
                    return 403 "Forbidden: User is not authorized to write metrics\n";
                }
                proxy_pass http://127.0.0.1:9009/api/v1/push;
                proxy_http_version 1.1;
                proxy_buffering off;
            }

            location /prometheus/ {
                if ($is_authorized != 2) {
                    return 403 "Forbidden: User is not authorized to query metrics\n";
                }
                proxy_pass http://127.0.0.1:9009/prometheus/;
                proxy_http_version 1.1;
                proxy_read_timeout 120s;
            }

            location ~* ^/(ring|compactor|all_user_stats) {
                deny all;
                return 403 "Forbidden: Administrative endpoints disabled\n";
            }

            location /ready {
                auth_basic off;
                proxy_pass http://127.0.0.1:9009/ready;
            }
        }
    }
