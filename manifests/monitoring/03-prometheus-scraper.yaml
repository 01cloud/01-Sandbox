---
# =====================================================================
# Prometheus Scraper – HUB VARIANT (primaryhub & secondaryhub)
# =====================================================================
# Deployed on: kind-primaryhub and kind-secondaryhub
# Scrapes: CNPG, OCM hub+agent, application services, Kubernetes pods
# Each metric is tagged with external_labels so Grafana can distinguish
# which cluster the metric originated from.
#
# The 'cluster' external_label value is templated by the apply script;
# override at apply time with:
#   sed 's/__CLUSTER_NAME__/primaryhub/' ... | kubectl apply -f -
# =====================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-scraper
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-scraper-role
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - daemonsets
      - statefulsets
      - deployments
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-scraper-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-scraper-role
subjects:
  - kind: ServiceAccount
    name: prometheus-scraper
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-scraper-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s
      # ── Cluster Identity Label ──────────────────────────────────────────────
      # Every metric scraped on this cluster will carry cluster="<name>" so
      # the central Grafana can filter/group by cluster without ambiguity.
      external_labels:
        cluster: "__CLUSTER_NAME__"
        cluster_role: "__CLUSTER_ROLE__"

    # ── Push-Based Remote Write to Central TSDB in US East ──────────────────
    remote_write:
      - url: "http://10.99.0.1:30900/api/v1/write"
        queue_config:
          capacity: 10000
          max_shards: 10
          min_shards: 1
          max_samples_per_send: 1000
          batch_send_deadline: 5s
          min_backoff: 500ms
          max_backoff: 10s

    scrape_configs:
      # 1. Prometheus Scraper Internal Metrics
      - job_name: 'prometheus-scraper'
        static_configs:
          - targets: ['localhost:9090']

      # 2. CloudNativePG Database Instances (PostgreSQL Metrics on Port 9187)
      #    Hub clusters only – spoke clusters do not run PostgreSQL.
      - job_name: 'cloudnative-pg-instances'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
            action: keep
            regex: .+
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name

      # 3. CloudNativePG Operator Manager Metrics (Port 8080)
      - job_name: 'cloudnative-pg-operator'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: cloudnative-pg
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name

      # 4. Open Cluster Management Hub Controllers (Port 8080)
      - job_name: 'open-cluster-management-hub'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - open-cluster-management-hub
                - open-cluster-management
        relabel_configs:
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:8080
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name

      # 5. Open Cluster Management Agent / Klusterlet (Port 8080)
      - job_name: 'open-cluster-management-agent'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - open-cluster-management-agent
        relabel_configs:
          - source_labels: [__address__]
            action: replace
            regex: ([^:]+)(?::\d+)?
            replacement: $1:8080
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name

      # 6. Kubernetes Services Annotated with prometheus.io/scrape
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: kubernetes_name

      # 7. Kubernetes Pods Annotated with prometheus.io/scrape
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-scraper
  namespace: monitoring
  labels:
    app: prometheus-scraper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-scraper
  template:
    metadata:
      labels:
        app: prometheus-scraper
    spec:
      serviceAccountName: prometheus-scraper
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=6h"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: metrics
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-scraper-config
        - name: storage
          emptyDir: {}
---
# ClusterIP Service – for in-cluster consumers (e.g. Grafana on same cluster)
apiVersion: v1
kind: Service
metadata:
  name: prometheus-scraper
  namespace: monitoring
  labels:
    app: prometheus-scraper
spec:
  type: ClusterIP
  selector:
    app: prometheus-scraper
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
---
# NodePort Service – exposes Prometheus on the WireGuard node IP so that
# the central Grafana on primaryhub can pull remote-cluster metrics via
# the WireGuard mesh (10.99.0.0/24). NodePort 30900 is reserved for this.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-scraper-nodeport
  namespace: monitoring
  labels:
    app: prometheus-scraper
  annotations:
    # Document that this port is reached over WireGuard only – not public.
    note: "Reachable only via WireGuard overlay 10.99.0.0/24"
spec:
  type: NodePort
  selector:
    app: prometheus-scraper
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      nodePort: 30900
      protocol: TCP
