apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: {{ .Values.namespace }}
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Default Dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana-dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-codeinspector
  namespace: {{ .Values.namespace }}
data:
  codeinspector-dashboard.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": 1,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "title": "API Request Rate (Throughput)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[2m])) by (path, method)",
              "legendFormat": "{{ "{{" }}method{{ "}}" }} {{ "{{" }}path{{ "}}" }}",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "title": "API Request Latency (P95)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, path))",
              "legendFormat": "{{ "{{" }}path{{ "}}" }} (P95)",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "title": "Queue Depths (Active Scans)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "rabbitmq_queue_messages_ready{queue=~\"scan.*\"}",
              "legendFormat": "{{ "{{" }}queue{{ "}}" }} depth",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 4,
          "title": "Job Execution Duration (Worker Latency)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.90, sum(rate(job_execution_duration_seconds_bucket[5m])) by (le, job_type))",
              "legendFormat": "{{ "{{" }}job_type{{ "}}" }} P90 time",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "id": 5,
          "title": "Job Failure/Success Counts by Type",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(job_execution_total[5m])) by (job_type, status)",
              "legendFormat": "{{ "{{" }}job_type{{ "}}" }} - {{ "{{" }}status{{ "}}" }}",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "id": 6,
          "title": "Active Database Connections",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "sum(db_connections_active)",
              "legendFormat": "Active Connections",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "id": 7,
          "title": "Queue Depths (API Injected)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "sum(queue_depth_jobs) by (queue_name)",
              "legendFormat": "{{ "{{" }}queue_name{{ "}}" }} depth",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "id": 8,
          "title": "API Authentication Success vs Failures",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(api_key_requests_total[5m]))",
              "legendFormat": "Total Key Requests",
              "refId": "A"
            },
            {
              "expr": "sum(rate(auth_failures_total[5m])) by (reason)",
              "legendFormat": "Auth Failures ({{ "{{" }}reason{{ "}}" }})",
              "refId": "B"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "id": 9,
          "title": "Application Errors & Exceptions",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "Prometheus"
          },
          "targets": [
            {
              "expr": "sum(rate(application_errors_total[5m])) by (status_code, path)",
              "legendFormat": "HTTP {{ "{{" }}status_code{{ "}}" }} - {{ "{{" }}path{{ "}}" }}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "title": "CodeInspector System Dashboard",
      "uid": "codeinspector-main",
      "version": 1
    }
  multi-cluster-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "id": 1,
          "title": "Prometheus Scraper Status Across Active Clusters",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-primaryhub"
              },
              "expr": "up{cluster=~\"primaryhub|\"}",
              "legendFormat": "primaryhub: {{ "{{" }}job{{ "}}" }}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-secondaryhub"
              },
              "expr": "up{cluster=\"secondaryhub\"}",
              "legendFormat": "secondaryhub: {{ "{{" }}job{{ "}}" }}",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-spoke1"
              },
              "expr": "up{cluster=\"spoke1\"}",
              "legendFormat": "spoke1: {{ "{{" }}job{{ "}}" }}",
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-spoke2"
              },
              "expr": "up{cluster=\"spoke2\"}",
              "legendFormat": "spoke2: {{ "{{" }}job{{ "}}" }}",
              "refId": "D"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "UP",
                      "color": "green"
                    },
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "PostgreSQL High Availability & Standby Replication Lag",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-primaryhub"
              },
              "expr": "cnpg_pg_replication_lag or cnpg_pg_stat_replication_stream_write_lag_seconds or vector(0)",
              "legendFormat": "primaryhub: Write Lag (s)",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-primaryhub"
              },
              "expr": "cnpg_pg_stat_replication_stream_replay_lag_seconds or vector(0)",
              "legendFormat": "primaryhub: Replay Lag (s)",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-secondaryhub"
              },
              "expr": "rate(cnpg_collector_wal_bytes[5m])",
              "legendFormat": "secondaryhub: WAL Ingest Rate (Bps)",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 10
              }
            }
          }
        },
        {
          "id": 3,
          "title": "OCM Admission Webhook & Operator Throughput",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-primaryhub"
              },
              "expr": "sum(rate(controller_runtime_webhook_requests_total[5m])) by (code)",
              "legendFormat": "primaryhub webhook: HTTP {{ "{{" }}code{{ "}}" }}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-secondaryhub"
              },
              "expr": "sum(rate(workqueue_adds_total[5m]))",
              "legendFormat": "secondaryhub workqueue ops/s",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15
              }
            }
          }
        },
        {
          "id": 4,
          "title": "Spoke Edge Clusters Status & DNS Health",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-spoke1"
              },
              "expr": "up{cluster=\"spoke1\",job=\"prometheus-scraper\"} or up{cluster=\"spoke1\"}",
              "legendFormat": "Spoke1 Edge Scraper",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-spoke1"
              },
              "expr": "up{cluster=\"spoke1\",job=\"kubernetes-services\"} or up{cluster=\"spoke1\"}",
              "legendFormat": "Spoke1 CoreDNS Service",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-spoke2"
              },
              "expr": "up{cluster=\"spoke2\",job=\"prometheus-scraper\"} or up{cluster=\"spoke2\"}",
              "legendFormat": "Spoke2 Edge Scraper",
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-spoke2"
              },
              "expr": "up{cluster=\"spoke2\",job=\"kubernetes-services\"} or up{cluster=\"spoke2\"}",
              "legendFormat": "Spoke2 CoreDNS Service",
              "refId": "D"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "HEALTHY",
                      "color": "green"
                    },
                    "0": {
                      "text": "DEGRADED",
                      "color": "red"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Spoke Edge CoreDNS Resolution Traffic (QPS)",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 6
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-spoke1"
              },
              "expr": "sum(rate(coredns_dns_requests_total{cluster=\"spoke1\"}[5m])) or sum(rate(coredns_dns_request_count_total{cluster=\"spoke1\"}[5m])) or vector(0)",
              "legendFormat": "spoke1 DNS QPS",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus-spoke2"
              },
              "expr": "sum(rate(coredns_dns_requests_total{cluster=\"spoke2\"}[5m])) or sum(rate(coredns_dns_request_count_total{cluster=\"spoke2\"}[5m])) or vector(0)",
              "legendFormat": "spoke2 DNS QPS",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 15
              }
            }
          }
        }
      ],
      "refresh": "15s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": [
        "multi-cluster",
        "overview",
        "01sandbox"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "01-Sandbox Multi-Cluster Central Overview",
      "uid": "01sandbox-overview",
      "version": 2
    }
  primaryhub.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "id": 1,
          "title": "PostgreSQL Streaming Replicas",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus-primaryhub"
          },
          "targets": [
            {
              "expr": "cnpg_pg_replication_streaming_replicas",
              "legendFormat": "Replicas",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "PostgreSQL Replication Lag",
          "type": "stat",
          "gridPos": {
            "x": 4,
            "y": 0,
            "w": 4,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus-primaryhub"
          },
          "targets": [
            {
              "expr": "cnpg_pg_replication_lag",
