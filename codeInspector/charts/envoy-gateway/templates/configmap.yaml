apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "envoy-gateway.fullname" . }}-config
  namespace: {{ .Values.namespace | default "opensandbox-system" }}
  labels:
    {{- include "envoy-gateway.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: {{ .Values.service.adminPort | default 9901 }}
    static_resources:
      listeners:
      - name: ingress_http_listener
        address:
          socket_address:
            protocol: TCP
            address: 0.0.0.0
            port_value: {{ .Values.service.httpPort | default 80 }}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              codec_type: AUTO
              stream_idle_timeout: 15s
              route_config:
                name: ingress_http_route
                virtual_hosts:
                - name: backend
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: ingress_http_cluster
                      timeout: 120s
                      upgrade_configs:
                      - upgrade_type: websocket
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: ingress_http_cluster
        connect_timeout: 0.5s
        type: STATIC
        lb_policy: ROUND_ROBIN
        close_connections_on_host_health_failure: true
        health_checks:
        - timeout: {{ .Values.healthCheck.timeout | default "1s" }}
          interval: {{ .Values.healthCheck.interval | default "1s" }}
          unhealthy_threshold: {{ .Values.healthCheck.unhealthyThreshold | default 2 }}
          healthy_threshold: {{ .Values.healthCheck.healthyThreshold | default 2 }}
          tcp_health_check: {}
        load_assignment:
          cluster_name: ingress_http_cluster
          endpoints:
          - priority: {{ .Values.primaryHub.priority | default 0 }}
            lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: {{ .Values.primaryHub.host | quote }}
                    port_value: {{ .Values.primaryHub.port | default 80 }}
          - priority: {{ .Values.secondaryHub.priority | default 1 }}
            lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: {{ .Values.secondaryHub.host | quote }}
                    port_value: {{ .Values.secondaryHub.port | default 80 }}
